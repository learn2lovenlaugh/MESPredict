name: Refresh data

on:
  schedule:
    # 21:20 UTC weekdays = 17:20 ET during EDT, 16:20 ET during EST.
    # GitHub queues free-tier cron jobs, so expect 5-30 min of slop.
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Installed inline on purpose. "cache: pip" needs a requirements.txt
      # or pyproject.toml present in the repo and hard-fails without one;
      # caching a single small package is not worth that failure mode.
      - run: pip install "requests>=2.31,<3"

      - name: Self-test scoring
        run: python scripts/selftest.py

      - name: Fetch and score
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch.py

      - name: Commit snapshot
        run: |
          git config user.name  "risk-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push || {
              echo "::error::Push refused. Settings > Actions > General >"
              echo "::error::Workflow permissions must be 'Read and write'."
              exit 1
            }
          fi
