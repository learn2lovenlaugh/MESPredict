name: Fetch FRED data

on:
  schedule:
    # 22:40 UTC on weekdays. That is after the US cash close year round,
    # so Treasury yields and index closes for the day are posted.
    - cron: "40 22 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # required so the job can commit fred-data.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_fred.py "" fred-data.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- fred-data.json; then
            echo "No change in fred-data.json"
          else
            git add fred-data.json
            git commit -m "FRED data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
