       '<section class="card contrib">' + M.cats.map(function(c){
    var maxAbs = 30;
    var wpct = Math.min(50, Math.abs(c.points)/maxAbs*50);
    var style = c.points >= 0
      ? 'left:50%;width:'+wpct+'%;background:var(--pos)'
      : 'right:50%;width:'+wpct+'%;background:var(--neg)';
    return '<div class="crow"><div class="clab">'+esc(c.name)+'</div>' +
           '<div class="cbar"><div class="cmid"></div><div class="cfill" style="'+style+'"></div></div>' +
           '<div class="cval '+toneCls(c.points)+'">'+sgn(c.points)+'</div></div>';
  }).join("") + '</section>';

  var comp = {coincident:0, leading:0, lagging:0};
  M.rows.forEach(function(r){ if(r.score !== null) comp[r.ind.lead || "coincident"] += r.weight; });
  var ctot = comp.coincident + comp.leading + comp.lagging;
  if(ctot > 0){
    h += '<section class="card pad" style="margin-top:14px"><div class="kv" style="margin:0;padding:0;border:0">' +
      '<div><span>Leading weight</span><b>'+Math.round(comp.leading/ctot*100)+'%</b></div>' +
      '<div><span>Coincident weight</span><b>'+Math.round(comp.coincident/ctot*100)+'%</b></div>' +
      '<div><span>Lagging weight</span><b>'+Math.round(comp.lagging/ctot*100)+'%</b></div>' +
      '</div><div class="note">Coincident inputs are defined off price and move with the week being measured, ' +
      'so they describe conditions rather than anticipate them. A score dominated by coincident weight is a ' +
      'regime description, not a forecast.</div></section>';
  }

  if(M.rules.length){
    h += '<h2>Cross-indicator adjustments<span class="sub">'+sgn(M.adj)+' points on top of '+sgn(M.base)+'</span></h2>' +
      '<section class="card pad">' + M.rules.map(function(r){
        return '<div class="drow"><span style="flex:1"><b style="color:var(--ink)">'+esc(r.name)+'</b><br>' +
               '<span style="font-size:12.5px">'+esc(r.why)+'</span></span>' +
               '<b class="'+toneCls(r.adj)+'">'+sgn(r.adj)+'</b></div>';
      }).join("") + '</section>';
  } else {
    h += '<h2>Cross-indicator adjustments</h2><section class="card pad"><div class="note">' +
      'No rules fired this week. The score is the plain weighted average of the indicators above.</div></section>';
  }

  h += '<h2>All indicators<span class="sub">tap a row for detail and manual entry</span></h2>' + indicatorTable(M.rows);

  h += '<div class="btns"><button class="btn primary" data-act="snap">Save this week</button>' +
       '<button class="btn" data-act="tab" data-tab="settings">Adjust weights</button></div>' +
       '<div class="note">Saving freezes every value, score and contribution shown above under today\'s date. ' +
       'Saved weeks are never recalculated when later data arrives.</div>';
  return h;
}

function viewCategory(M, catId){
  var c = M.cats.filter(function(x){ return x.id === catId; })[0];
  if(!c) return '<div class="empty"><b>Unknown section</b></div>';
  var pts = c.points;
  var h = '<h2>'+esc(c.name)+'<span class="sub">'+Math.round(c.weight)+'% of model weight</span></h2>' +
    '<section class="card pad"><div class="kv" style="margin:0;padding:0;border:0">' +
      '<div><span>Contribution</span><b class="'+toneCls(pts)+'">'+sgn(pts)+'</b></div>' +
      '<div><span>Indicators</span><b>'+c.rows.length+'</b></div>' +
      '<div><span>Scored</span><b>'+c.rows.filter(function(r){return r.score!==null;}).length+'</b></div>' +
    '</div></section>' +
    '<h2>Indicators</h2>' + indicatorTable(c.rows);
  return h;
}

function indicatorTable(rows){
  var body = rows.map(function(r){
    var a = ago(r.val.updated);
    return '<tr data-ind="'+r.ind.id+'">' +
      '<td><div class="iname">'+esc(r.ind.name)+
        (r.src==="manual" ? ' <span class="pill p-flat">Manual</span>' :
         r.src==="live"   ? ' <span class="pill p-pos">Live</span>' :
                            ' <span class="pill p-warn">No data</span>')+'</div>' +
        '<div class="isrc">'+esc(r.ind.drvLabel)+'</div></td>' +
      '<td class="r num">'+drv(r)+'</td>' +
      '<td class="r"><span class="'+pillCls(r.score)+'">'+(r.score===null?"n/a":sgn(r.score))+'</span></td>' +
      '<td class="r num">'+Math.round(r.weight)+'%</td>' +
      '<td class="r num '+toneCls(r.contrib)+'">'+sgnf(r.contrib,1)+'</td>' +
      '<td class="r isrc'+(a.stale?" stale":"")+'">'+esc(a.txt)+'</td>' +
    '</tr>';
  }).join("");
  return '<section class="card scroll"><table class="tbl"><thead><tr>' +
    '<th>Indicator</th><th class="r">Value</th><th class="r">Score</th><th class="r">Weight</th>' +
    '<th class="r">Contribution</th><th class="r">Updated</th></tr></thead><tbody>' + body + '</tbody></table></section>';
}

function viewCalendar(M){
  var rows = MOCK.calendar.map(function(e){
    var cls = e.imp === "High" ? "p-neg" : e.imp === "Medium" ? "p-warn" : "p-flat";
    return '<tr><td class="num">'+esc(e.date)+'</td><td class="num">'+esc(e.time)+'</td>' +
      '<td class="iname">'+esc(e.name)+'</td><td class="r num">'+esc(e.prev||"--")+'</td>' +
      '<td class="r num">'+esc(e.cons||"--")+'</td><td class="r num">'+esc(e.actual||"--")+'</td>' +
      '<td class="r"><span class="pill '+cls+'">'+esc(e.imp)+'</span></td></tr>';
  }).join("");
  return '<h2>Upcoming events<span class="sub">event risk '+esc(M.event)+'</span></h2>' +
    '<section class="card scroll"><table class="tbl"><thead><tr><th>Date</th><th>Time ET</th><th>Event</th>' +
    '<th class="r">Previous</th><th class="r">Consensus</th><th class="r">Actual</th><th class="r">Impact</th>' +
    '</tr></thead><tbody>'+rows+'</tbody></table></section>' +
    '<div class="note">Event risk is HIGH when at least one high-impact release falls in the next seven days. ' +
    'It subtracts '+CONFIG.eventRisk.confidencePenalty.HIGH+' points from confidence, not from the regime score. ' +
    'This calendar is sample data; Phase 5 replaces it with a fetched or pasted schedule.</div>';
}

function viewHistory(M){
  if(!STATE.snaps.length){
    return '<h2>Saved weeks</h2><section class="card"><div class="empty">' +
      '<b>No weeks saved yet</b>Save a week from the Overview tab to freeze the current score and every input behind it. ' +
      'The next week\'s MES close gets filled in afterward, which is how the model gets scored.</div></section>';
  }
  var rows = STATE.snaps.slice().sort(function(a,b){ return b.date < a.date ? -1 : 1; }).map(function(s){
    var ret = (s.mesEnd !== null && s.mesEnd !== undefined && s.mesEnd !== "")
      ? ((Number(s.mesEnd) - Number(s.mesStart))/Number(s.mesStart)*100) : null;
    var result = "--";
    if(ret !== null){
      if(Math.abs(s.score) < 20) result = "Neutral";
      else if((s.score > 0 && ret > 0) || (s.score < 0 && ret < 0)) result = "Correct";
      else result = "Wrong";
    }
    var rcls = result === "Correct" ? "p-pos" : result === "Wrong" ? "p-neg" : "p-flat";
    return '<tr><td class="num">'+esc(s.date)+'</td>' +
      '<td class="r num '+toneCls(s.score)+'">'+sgn(s.score)+'</td>' +
      '<td>'+esc(s.bias)+'</td>' +
      '<td class="r num">'+fmt(s.mesStart,"")+'</td>' +
      '<td class="r"><input type="number" step="0.25" data-endfor="'+esc(s.id)+'" value="'+esc(s.mesEnd===null?"":s.mesEnd)+'" style="width:96px;margin:0" placeholder="close"></td>' +
      '<td class="r num '+(ret===null?"":toneCls(ret))+'">'+(ret===null?"--":sgnf(ret,2)+"%")+'</td>' +
      '<td class="r"><span class="pill '+rcls+'">'+result+'</span></td>' +
      '<td class="r"><button class="btn" data-del="'+esc(s.id)+'" style="padding:4px 9px">Remove</button></td></tr>';
  }).join("");

  return '<h2>Saved weeks<span class="sub">'+STATE.snaps.length+' recorded</span></h2>' +
    '<section class="card scroll"><table class="tbl"><thead><tr><th>Week of</th><th class="r">Score</th><th>Bias</th>' +
    '<th class="r">MES start</th><th class="r">MES end</th><th class="r">Return</th><th class="r">Result</th><th></th>' +
    '</tr></thead><tbody>'+rows+'</tbody></table></section>' +
    '<div class="note">Enter the following Friday close in the MES end column. Everything else is frozen and will not change.</div>' +
    '<div class="btns"><button class="btn" data-act="exportjson">Export JSON</button>' +
    '<button class="btn" data-act="exportcsv">Export CSV</button>' +
    '<button class="btn" data-act="import">Import JSON</button>' +
    '<button class="btn danger" data-act="clear">Clear saved weeks</button></div>';
}

function pctc(v){ return v===null?"--":(v>0?"+":"")+v.toFixed(2)+"%"; }

function viewAnalytics(M){
  if(!STATE.live || !STATE.live.series){
    return '<h2>Model performance</h2><section class="card"><div class="empty">' +
      '<b>No history loaded</b>The backtest replays the model over the fetched FRED series. ' +
      'Load fred-data.json first and this fills in.</div></section>';
  }
  if(!BT) BT = runBacktest();
  if(BT && BT.error){
    return '<h2>Model performance</h2><section class="card"><div class="empty"><b>Cannot run yet</b>' +
      esc(BT.error) + '</div></section>';
  }
  var st = BT.stats;

  var buckets = st.buckets.map(function(b){
    var lab = b.lo <= -101 ? "below -60" : b.hi >= 101 ? "above +60" : sgn(b.lo) + " to " + sgn(b.hi);
    return '<tr><td>'+esc(lab)+'</td><td class="r num">'+b.n+'</td>' +
      '<td class="r num '+(b.avg===null?"":toneCls(b.avg))+'">'+(b.avg===null?"--":pctc(b.avg))+'</td>' +
      '<td class="r num">'+(b.pos===null?"--":Math.round(b.pos)+"%")+'</td></tr>';
  }).join("");

  var inds = BT.indicators.map(function(r){
    return '<tr><td class="iname">'+esc(r.name)+'</td>' +
      '<td class="r num '+(r.corr===null?"":toneCls(r.corr))+'">'+(r.corr===null?"--":r.corr.toFixed(3))+'</td>' +
      '<td class="r num">'+(r.hit===null?"--":Math.round(r.hit)+"%")+'</td>' +
      r.avg.map(function(x){
        return '<td class="r num '+(x.avg===null?"":toneCls(x.avg))+'" style="font-size:12.5px">' +
               (x.avg===null?"--":pctc(x.avg))+'</td>';
      }).join("") + '</tr>';
  }).join("");

  var edge = st.hitRate === null ? null : st.hitRate - 50;
  var verdict;
  if(st.corr === null) verdict = "Not enough variation to judge.";
  else if(Math.abs(st.corr) < 0.10)
    verdict = "Correlation between score and next-week return is near zero. On this sample the model is not distinguishing good weeks from bad ones. That is a real result, not a bug: most weekly equity direction is unpredictable, and a score that tracked it strongly would be more suspicious than one that does not.";
  else if(st.corr > 0)
    verdict = "The score and the following week's return move together, weakly. Treat a correlation this size as a hypothesis to keep testing, not a validated edge.";
  else
    verdict = "The score moves inversely to the following week's return on this sample, which would mean the model is systematically backwards. More likely it means the sample is small and the sign is noise.";

  return '<h2>Backtest<span class="sub">'+st.n+' weeks, '+esc(st.from)+' to '+esc(st.to)+'</span></h2>' +
    '<section class="card pad"><div class="kv" style="margin:0;padding:0;border:0">' +
      '<div><span>Weeks tested</span><b>'+st.n+'</b></div>' +
      '<div><span>Directional calls</span><b>'+st.directional+'</b></div>' +
      '<div><span>Hit rate</span><b class="'+(edge===null?"":toneCls(edge))+'">'+(st.hitRate===null?"--":Math.round(st.hitRate)+"%")+'</b></div>' +
      '<div><span>Score vs return</span><b class="'+(st.corr===null?"":toneCls(st.corr))+'">'+(st.corr===null?"--":st.corr.toFixed(3))+'</b></div>' +
      '<div><span>Weeks positive</span><b>'+Math.round(st.posWeeks)+'%</b></div>' +
    '</div>' +
    '<div class="note" style="margin-top:14px">'+esc(verdict)+'</div></section>' +

    '<h2>Return after each reading</h2><section class="card scroll"><table class="tbl"><thead><tr>' +
    '<th>Signal</th><th class="r">Weeks</th><th class="r">Avg next week</th></tr></thead><tbody>' +
    '<tr><td>Risk-On (+20 or more)</td><td class="r num">'+st.bullN+'</td><td class="r num '+(st.bullAvg===null?"":toneCls(st.bullAvg))+'">'+pctc(st.bullAvg)+'</td></tr>' +
    '<tr><td>Neutral</td><td class="r num">'+st.neuN+'</td><td class="r num '+(st.neuAvg===null?"":toneCls(st.neuAvg))+'">'+pctc(st.neuAvg)+'</td></tr>' +
    '<tr><td>Risk-Off (-20 or less)</td><td class="r num">'+st.bearN+'</td><td class="r num '+(st.bearAvg===null?"":toneCls(st.bearAvg))+'">'+pctc(st.bearAvg)+'</td></tr>' +
    '<tr><td>All weeks (the benchmark)</td><td class="r num">'+st.n+'</td><td class="r num '+(st.allAvg===null?"":toneCls(st.allAvg))+'">'+pctc(st.allAvg)+'</td></tr>' +
    '</tbody></table></section>' +
    '<div class="note">The bottom row is what matters. If Risk-On weeks do not beat all weeks, the score is adding nothing over simply being invested.</div>' +

    '<h2>Score buckets</h2><section class="card scroll"><table class="tbl"><thead><tr>' +
    '<th>Score range</th><th class="r">Weeks</th><th class="r">Avg return</th><th class="r">Positive</th>' +
    '</tr></thead><tbody>'+buckets+'</tbody></table></section>' +

    '<h2>Indicator effectiveness<span class="sub">sorted by absolute correlation</span></h2>' +
    '<section class="card scroll"><table class="tbl"><thead><tr>' +
    '<th>Indicator</th><th class="r">Corr</th><th class="r">Hit</th>' +
    '<th class="r">+2</th><th class="r">+1</th><th class="r">0</th><th class="r">-1</th><th class="r">-2</th>' +
    '</tr></thead><tbody>'+inds+'</tbody></table></section>' +
    '<div class="note">Columns +2 to -2 are the average following-week return when that indicator scored that value. ' +
    'An indicator earning its weight should show returns falling as you read left to right. One that shows no pattern ' +
    'is contributing noise, and its weight is better spent elsewhere or set to zero.</div>' +

    '<div class="btns"><button class="btn" data-act="rerun">Re-run backtest</button>' +
    '<button class="btn" data-act="exportbt">Export weeks as CSV</button></div>' +
    '<div class="note">Re-run after changing any weight or threshold. Changing weights until this page looks good is ' +
    'curve fitting, and the result will not survive contact with next month.</div>';
}

function statCell(sl, showAcc){
  if(!sl) return '<td class="r">--</td><td class="r">--</td><td class="r">--</td>';
  var edge = (sl.acc === null) ? null : sl.acc - sl.bench;
  return '<td class="r num">'+sl.n+'</td>' +
    '<td class="r num '+(edge===null?"":toneCls(edge))+'">'+(sl.acc===null?"--":sl.acc.toFixed(1)+"%")+
      '<div class="isrc">vs '+sl.bench.toFixed(1)+'% long</div></td>' +
    '<td class="r num '+(sl.spread===null?"":toneCls(sl.spread))+'">'+(sl.spread===null?"--":pctc(sl.spread))+'</td>';
}

function viewOptimizer(M){
  if(!STATE.live || !STATE.live.series){
    return '<h2>Factor lab</h2><section class="card"><div class="empty">' +
      '<b>No history loaded</b>The lab needs the fetched FRED series to backtest against.</div></section>';
  }
  var R = runLab();
  if(!R || R.error){
    return '<h2>Factor lab</h2><section class="card"><div class="empty"><b>Cannot run</b>' +
      esc(R && R.error ? R.error : "Backtest unavailable.") + '</div></section>';
  }

  var L = STATE.lab;
  var onCount = CONFIG.indicators.filter(function(i){ return L.enabled[i.id]; }).length;
  var totalW = CONFIG.indicators.reduce(function(a,i){ return a + (L.enabled[i.id] ? Number(L.weights[i.id]||0) : 0); }, 0);

  /* factor table */
  var rows = CONFIG.indicators.map(function(i){
    var on = !!L.enabled[i.id];
    return '<tr'+(on?'':' class="spin"')+'>' +
      '<td><label style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
        '<input type="checkbox" data-lab="'+i.id+'"'+(on?' checked':'')+' style="width:auto;margin:0">' +
        '<span><span class="iname">'+esc(i.name)+'</span>' +
        '<div class="isrc">'+esc(i.factor||"")+' / '+esc(i.lead||"")+'</div></span></label></td>' +
      '<td class="r"><input type="number" min="0" max="60" step="0.5" data-labw="'+i.id+'" ' +
        'value="'+Number(L.weights[i.id]||0)+'" style="width:76px;margin:0;text-align:right"'+(on?'':' disabled')+'></td>' +
    '</tr>';
  }).join("");

  var bar = chanceBar(R.train.dir, L.attempts);
  var overfit = (R.train.acc !== null && R.val.acc !== null) ? R.train.acc - R.val.acc : null;

  var h = '<h2>Factor lab<span class="sub">'+onCount+' factors, '+totalW.toFixed(1)+'% weight</span></h2>' +

    '<section class="card scroll"><table class="tbl"><thead><tr>' +
      '<th>Sample</th><th class="r">Weeks</th><th class="r">Accuracy</th><th class="r">Risk-On minus Risk-Off</th>' +
    '</tr></thead><tbody>' +
      '<tr><td><b>Train</b><div class="isrc">'+esc(R.train.from)+' to '+esc(R.train.to)+'</div></td>'+statCell(R.train)+'</tr>' +
      '<tr><td><b>Validation</b><div class="isrc">'+esc(R.val.from)+' to '+esc(R.val.to)+'</div></td>'+statCell(R.val)+'</tr>' +
      (L.revealed
        ? '<tr><td><b>Sealed</b><div class="isrc">opened '+L.looks+' time'+(L.looks===1?'':'s')+'</div></td>'+statCell(R.sealed)+'</tr>'
        : '<tr><td><b>Sealed</b><div class="isrc">'+R.sealed.n+' weeks held back</div></td>' +
          '<td colspan="3" class="r"><button class="btn" data-act="unseal">Open sealed sample</button></td></tr>') +
    '</tbody></table></section>' +

    '<div class="note">Accuracy is on directional calls only, scored against always being long over the same weeks. ' +
    'Beating that second number is the bar; beating 50% is not. The right-hand column is the average return after ' +
    'Risk-On readings minus the average after Risk-Off, which is what an edge would actually pay you.</div>';

  /* honest read on the current recipe */
  var verdict, vtone;
  if(R.val.acc === null){ verdict = "Not enough directional calls in validation to judge. Widen the bands or add weight."; vtone = "twarn"; }
  else if(overfit !== null && overfit > 6){
    verdict = "Train beats validation by " + overfit.toFixed(1) + " points. That gap is the recipe fitting the training weeks rather than the market. Fewer factors usually shrinks it.";
    vtone = "tneg";
  } else if(R.val.acc - R.val.bench > 2){
    verdict = "Validation is running " + (R.val.acc - R.val.bench).toFixed(1) + " points above always-long, and the train-validation gap is small. That is what a real, modest edge looks like.";
    vtone = "tpos";
  } else {
    verdict = "Validation is not beating always-long. On this recipe the score is not adding information over simply holding the index.";
    vtone = "tflat";
  }

  h += '<section class="card pad" style="margin-top:14px"><div class="'+vtone+'" style="font-size:14px;line-height:1.6">' +
       esc(verdict) + '</div>' +
       (bar ? '<div class="note" style="margin-top:10px">You have tested '+L.attempts+' configuration' +
         (L.attempts===1?'':'s')+'. With this many tries, the best one would be expected to reach about ' +
         bar.toFixed(1) + '% on the training sample by chance alone. Treat anything below that as noise.</div>' : '') +
       '</section>';

  h += '<h2>Ingredients<span class="sub">untick to remove, edit to reweight</span></h2>' +
    '<section class="card scroll"><table class="tbl"><thead><tr><th>Factor</th><th class="r">Weight</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table></section>' +
    '<div class="btns">' +
      '<button class="btn" data-act="labnorm">Normalize to 100</button>' +
      '<button class="btn" data-act="labreset">Reset</button>' +
      '<button class="btn" data-act="labmin">Keep top 3 only</button>' +
      '<button class="btn primary" data-act="labsave">Save recipe</button>' +
      '<button class="btn" data-act="labapply">Use in live model</button>' +
    '</div>';

  if(L.recipes.length){
    h += '<h2>Saved recipes</h2><section class="card scroll"><table class="tbl"><thead><tr>' +
      '<th>Name</th><th class="r">Factors</th><th class="r">Train</th><th class="r">Validation</th><th class="r">Spread</th><th></th>' +
      '</tr></thead><tbody>' + L.recipes.map(function(r, ix){
        var gap = (r.train !== null && r.val !== null) ? r.train - r.val : null;
        return '<tr><td class="iname">'+esc(r.name)+'</td>' +
          '<td class="r num">'+r.count+'</td>' +
          '<td class="r num">'+(r.train===null?"--":r.train.toFixed(1)+"%")+'</td>' +
          '<td class="r num '+(gap!==null && gap>6?"tneg":"")+'">'+(r.val===null?"--":r.val.toFixed(1)+"%")+'</td>' +
          '<td class="r num '+(r.spread===null?"":toneCls(r.spread))+'">'+(r.spread===null?"--":pctc(r.spread))+'</td>' +
          '<td class="r"><button class="btn" data-loadrec="'+ix+'" style="padding:4px 9px">Load</button></td></tr>';
      }).join("") + '</tbody></table></section>';
  }

  return h;
}

function viewSettings(M){
  var total = CONFIG.indicators.reduce(function(a,i){ return a + Number(STATE.weights[i.id]||0); }, 0);
  var byCat = CONFIG.categories.map(function(c){
    var inds = CONFIG.indicators.filter(function(i){ return i.cat === c.id; });
    var cw = inds.reduce(function(a,i){ return a + Number(STATE.weights[i.id]||0); }, 0);
    return '<h2>'+esc(c.name)+'<span class="sub">'+cw.toFixed(1)+'%</span></h2><section class="card pad"><div class="wgrid">' +
      inds.map(function(i){
        return '<div>'+esc(i.name)+'</div><input type="number" min="0" max="60" step="0.5" data-w="'+i.id+'" value="'+Number(STATE.weights[i.id]||0)+'">';
      }).join("") + '</div></section>';
  }).join("");

  var c = coverageState();
  var logRows = (STATE.live && STATE.live.log ? STATE.live.log : []).map(function(l){
    return '<tr><td>'+esc(l.id)+'</td><td class="'+(l.ok?"tpos":"tneg")+'">'+esc(l.msg)+'</td></tr>';
  }).join("");

  var dataPanel = '<h2>Live data<span class="sub">FRED via fred-data.json</span></h2><section class="card pad">' +
    '<div class="note">This page reads <b>fred-data.json</b> from its own folder on load. That file is written by the ' +
    'scheduled GitHub Action, or by running <b>fetch_fred.py</b> yourself. The dashboard cannot call the FRED API ' +
    'directly from a browser: FRED does not permit cross-origin requests, so that route is closed regardless of how ' +
    'the page is hosted. Your API key lives in the repository secrets, not in this file.</div>' +
    '<div class="btns"><button class="btn primary" data-act="refresh"'+(STATE.fetching?' disabled':'')+'>'+(STATE.fetching?"Loading...":"Refresh data")+'</button>' +
    '<button class="btn" data-act="loadfile">Load a file manually</button>' +
    (STATE.live ? '<button class="btn danger" data-act="clearlive">Clear fetched data</button>' : '') + '</div>' +
    '<div class="note" style="margin-top:14px">Currently '+c.live+' of '+c.total+' indicators on fetched data, ' +
      c.manual+' manual, '+c.sample+' with no data.</div>' +
    (logRows ? '<div class="log"><table>'+logRows+'</table></div>' : '') +
    '</section>' +
    '<h2>Not on FRED<span class="sub">manual entry required</span></h2><section class="card pad"><div class="log"><table>' +
    Object.keys(NO_FRED).map(function(k){
      var ind = CONFIG.indicators.filter(function(i){ return i.id === k; })[0];
      return '<tr><td>'+esc(ind?ind.name:k)+'</td><td style="text-align:left;color:var(--ink2)">'+esc(NO_FRED[k])+'</td></tr>';
    }).join("") + '</table></div>' +
    '<div class="note">CPI and payroll consensus figures are also manual: FRED publishes actuals, not expectations. ' +
    'Without a consensus the inflation surprise cannot be computed and that indicator drops out of the score.</div></section>';

  return dataPanel +
    '<h2>Model weights<span class="sub">applied live to the score</span></h2>' +
    '<section class="card pad"><div class="wsum"><span>Current total</span><span class="'+(Math.abs(total-100)<0.01?"tpos":"twarn")+'">'+total.toFixed(1)+'%</span></div>' +
    '<div class="note">Weights do not have to sum to 100. The score renormalizes against whatever weight is actually scored, ' +
    'so an indicator with no value drops out cleanly instead of dragging the total toward zero.</div>' +
    '<div class="btns"><button class="btn primary" data-act="savew">Save weights</button>' +
    '<button class="btn" data-act="normalize">Normalize to 100</button>' +
    '<button class="btn" data-act="resetw">Reset to defaults</button></div></section>' +
    byCat +
    '<h2>Stored data</h2><section class="card pad">' +
    '<div class="note">Saved weeks: '+STATE.snaps.length+'. Manual overrides: '+Object.keys(STATE.manual).length+' indicators. ' +
    'Everything lives in this browser only.</div>' +
    '<div class="btns"><button class="btn danger" data-act="clearmanual">Clear manual overrides</button></div></section>' +
    '<h2>Not yet built<span class="sub">for reference</span></h2><section class="card pad"><div class="note">' +
    'Editable thresholds, band cut-offs and confidence tuning: Phase 2. Live data providers: Phase 5. ' +
    'Indicator effectiveness: Phase 7. Thresholds are visible per indicator in the detail panel meanwhile.</div></section>';
}

/* =========================================================================
   DRAWER: indicator detail + manual entry
   ========================================================================= */

function openDrawer(html){
  document.getElementById("drawer").innerHTML = html;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

function drawerFor(id){
  var M = compute();
  var r = M.rows.filter(function(x){ return x.ind.id === id; })[0];
  if(!r) return;
  var ind = r.ind, a = ago(r.val.updated);

  var extra = (ind.fields||[]).map(function(f){
    return '<div class="drow"><span>'+esc(f[0])+'</span><b>'+fmt(r.val[f[1]], f[2])+'</b></div>';
  }).join("");

  var thr = '<div class="thr">Scoring thresholds on ' + esc(ind.drvLabel.toLowerCase()) + '<table>' +
    ind.thresholds.map(function(t, i){
      var prev = i === 0 ? null : ind.thresholds[i-1].max;
      var range = prev === null ? ("below " + t.max + (ind.drvUnit||""))
        : t.max === null ? (prev + (ind.drvUnit||"") + " and above")
        : (prev + " to " + t.max + (ind.drvUnit||""));
      return '<tr class="'+(r.score === t.s && hitRow(ind, r.driver, i) ? "hit" : "")+'">' +
             '<td>'+esc(range)+'</td><td style="text-align:right">'+sgn(t.s)+'</td></tr>';
    }).join("") + '</table></div>';

  var man = STATE.manual[id] || {};
  var form = '<h3 style="font-size:14px;margin:22px 0 0">Enter values</h3>' +
    '<div class="note">Whatever you type here replaces the sample value and is marked Manual.</div>' +
    '<label class="f">'+esc(ind.drvLabel)+' (drives the score)' +
      '<input type="number" step="any" data-m="'+id+'" data-k="'+esc(ind.driver)+'" value="'+esc(man[ind.driver]===undefined?"":man[ind.driver])+'" placeholder="'+esc(MOCK.values[id] ? MOCK.values[id][ind.driver] : "")+'"></label>' +
    (ind.fields||[]).map(function(f){
      return '<label class="f">'+esc(f[0])+'<input type="text" data-m="'+id+'" data-k="'+esc(f[1])+'" value="'+esc(man[f[1]]===undefined?"":man[f[1]])+'" placeholder="'+esc(MOCK.values[id] ? MOCK.values[id][f[1]] : "")+'"></label>';
    }).join("") +
    '<label class="f">As of<input type="text" data-m="'+id+'" data-k="updated" value="'+esc(man.updated===undefined?"":man.updated)+'" placeholder="2026-09-04T17:00:00"></label>' +
    '<label class="f">Notes<textarea data-m="'+id+'" data-k="notes">'+esc(man.notes||"")+'</textarea></label>' +
    '<div class="btns"><button class="btn primary" data-act="savem" data-id="'+id+'">Save values</button>' +
    (STATE.manual[id] ? '<button class="btn danger" data-act="clearm" data-id="'+id+'">Revert to sample</button>' : '') +
    '</div>';

  openDrawer(
    '<div class="dhead"><h3>'+esc(ind.name)+(r.manual?' <span class="pill p-flat">Manual</span>':'')+'</h3>' +
      '<button class="x" data-act="close" aria-label="Close">x</button></div>' +
    '<div class="dbody">' +
      '<div class="drow"><span>'+esc(ind.drvLabel)+'</span><b>'+drv(r)+'</b></div>' +
      extra +
      '<div class="drow"><span>Score</span><b class="'+toneCls(r.score)+'">'+(r.score===null?"no data":sgn(r.score))+'</b></div>' +
      '<div class="drow"><span>Weight</span><b>'+Math.round(r.weight)+'%</b></div>' +
      '<div class="drow"><span>Contribution</span><b class="'+toneCls(r.contrib)+'">'+sgnf(r.contrib,1)+'</b></div>' +
      '<div class="drow"><span>Measures</span><b>'+esc(ind.factor||"other")+' ('+esc(ind.lead||"coincident")+')</b></div>' +
      '<div class="drow"><span>Source</span><b>'+esc(ind.src)+'</b></div>' +
      '<div class="drow"><span>Value from</span><b>'+
        (r.src==="live"?"FRED fetch":r.src==="manual"?"your entry":"nothing yet")+'</b></div>' +
      (NO_FRED[ind.id] ? '<div class="note" style="margin-top:8px">'+esc(NO_FRED[ind.id])+' This one always needs entering by hand.</div>' : '') +
      '<div class="drow"><span>Updated</span><b class="'+(a.stale?"stale":"")+'">'+esc(a.txt)+'</b></div>' +
      '<div class="why">'+esc(ind.desc)+'</div>' +
      thr + form +
    '</div>'
  );
}

function hitRow(ind, driver, i){
  if(driver === null || driver === "" || isNaN(Number(driver))) return false;
  var x = Number(driver);
  for(var j=0;j<ind.thresholds.length;j++){
    var t = ind.thresholds[j];
    if(t.max === null || x < t.max) return j === i;
  }
  return false;
}

/* =========================================================================
   ACTIONS
   ========================================================================= */

function saveSnapshot(){
  var M = compute(), P = priceInfo();
  var d = new Date(P.asOf || nowRef());
  var id = "s" + Date.now();
  var snap = {
    id:id, date:d.toISOString().slice(0,10), savedAt:new Date().toISOString(),
    priceSource:P.label, coverage:coverageState(),
    mesStart:P.price, mesEnd:null,
    score:M.total, bias:M.band.label, confidence:M.confidence, event:M.event,
    weights:JSON.parse(JSON.stringify(STATE.weights)),
    indicators:M.rows.map(function(r){
      return {id:r.ind.id, name:r.ind.name, driver:r.driver, score:r.score,
              weight:r.weight, contribution:Number(r.contrib.toFixed(2)),
              manual:r.manual, values:JSON.parse(JSON.stringify(r.val))};
    }),
    categories:M.cats.map(function(c){ return {id:c.id, name:c.name, points:c.points}; }),
    events:upcoming(7), notes:""
  };
  STATE.snaps.push(snap);
  if(save(LS.snaps, STATE.snaps)){ STATE.tab = "history"; render(); }
  else alert("Could not write to local storage. Nothing was saved.");
}

function exportJSON(){
  download("mes-regime-history.json", JSON.stringify({
    exported:new Date().toISOString(), weights:STATE.weights,
    manual:STATE.manual, snapshots:STATE.snaps
  }, null, 2), "application/json");
}

function exportCSV(){
  var head = "week,score,bias,confidence,event_risk,mes_start,mes_end,next_week_return_pct\n";
  var body = STATE.snaps.map(function(s){
    var ret = s.mesEnd ? ((Number(s.mesEnd)-Number(s.mesStart))/Number(s.mesStart)*100).toFixed(3) : "";
    return [s.date, s.score, '"'+s.bias+'"', s.confidence, s.event, s.mesStart, s.mesEnd===null?"":s.mesEnd, ret].join(",");
  }).join("\n");
  download("mes-regime-history.csv", head + body, "text/csv");
}

function download(name, text, mime){
  var b = new Blob([text], {type:mime});
  var u = URL.createObjectURL(b);
  var a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 1500);
}

function importJSON(){
  var i = document.createElement("input");
  i.type = "file"; i.accept = ".json,application/json";
  i.onchange = function(){
    var f = i.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var d = JSON.parse(rd.result);
        if(d.snapshots){ STATE.snaps = d.snapshots; save(LS.snaps, STATE.snaps); }
        if(d.weights){ STATE.weights = d.weights; save(LS.settings, STATE.weights); }
        if(d.manual){ STATE.manual = d.manual; save(LS.manual, STATE.manual); }
        render();
      }catch(e){ alert("That file could not be read as dashboard JSON."); }
    };
    rd.readAsText(f);
  };
  i.click();
}

/* Primary path: read fred-data.json sitting next to this page. Same origin,
   so no CORS involved. The file is written by the scheduled GitHub Action
   or by running fetch_fred.py locally. Runs automatically on page load. */
function loadRepoData(announce){
  if(STATE.fetching) return;
  STATE.fetching = true;
  if(announce) render();

  fetch("fred-data.json?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){
      if(r.status === 404) throw new Error("nofile");
      if(!r.ok) throw new Error(r.status + " reading fred-data.json");
      return r.json();
    })
    .then(function(j){
      if(!j.series) throw new Error("fred-data.json has no series object.");
      var d = derive(j.series);
      var n = Object.keys(j.series).length;
      STATE.live = {fetched:j.fetched || new Date().toISOString(), values:d.values, index:d.index,
                    series:j.series,
                    log:[{id:"fred-data.json", ok:true, msg:n + " series"}]};
      save(LS.live, STATE.live);
      BT = null;
      STATE.fetching = false;
      render();
    })
    .catch(function(e){
      STATE.fetching = false;
      var quiet = String(e && e.message) === "nofile";
      if(!quiet || announce){
        STATE.live = STATE.live || {values:{}, index:null};
        STATE.live.log = [{id:"fred-data.json", ok:false,
          msg: quiet
            ? "Not found next to this page. The scheduled fetch has not run yet, or fred-data.json is not committed at the repo root."
            : String(e.message)}];
      }
      render();
    });
}

/* =========================================================================
   LIVE FETCH
   Direct browser call to the FRED API. This only works if FRED returns CORS
   headers to this origin. If it does not, the request fails before any
   response is readable and the browser gives no detail beyond "failed" -
   so the error below reports what is knowable and points at the fallback,
   rather than guessing. Opening this file from file:// will always fail:
   the origin is null and no CORS policy can permit it.
   ========================================================================= */

/* Fallback path: load a JSON file produced by the offline fetcher.
   Expected shape: {fetched:"...", series:{SERIES_ID:[{date,value},...]}} */
function loadDataFile(){
  var i = document.createElement("input");
  i.type = "file"; i.accept = ".json,application/json";
  i.onchange = function(){
    var f = i.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var j = JSON.parse(rd.result);
        if(!j.series) throw new Error("no series");
        var d = derive(j.series);
        var n = Object.keys(j.series).length;
        STATE.live = {fetched:j.fetched || new Date().toISOString(), values:d.values, index:d.index,
                      series:j.series,
                      log:[{id:"file", ok:true, msg:n + " series loaded from " + f.name}]};
        save(LS.live, STATE.live);
        render();
      }catch(e){
        alert("That file is not a FRED data export. It needs a top-level \"series\" object keyed by FRED series id.");
      }
    };
    rd.readAsText(f);
  };
  i.click();
}

function clearLive(){
  STATE.live = null;
  try{ localStorage.removeItem(LS.live); }catch(e){}
  render();
}

/* =========================================================================
   EVENTS
   ========================================================================= */

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-act],[data-tab],[data-ind],[data-del]") : null;

  if(e.target.id === "themeBtn"){ toggleTheme(); return; }
  if(e.target.id === "scrim"){ closeDrawer(); return; }
  if(!t) return;

  var act = t.getAttribute("data-act");

  if(t.classList.contains("tab")){ STATE.tab = t.getAttribute("data-tab"); render(); return; }
  if(act === "tab"){ STATE.tab = t.getAttribute("data-tab"); render(); return; }
  if(act === "close"){ closeDrawer(); return; }
  if(act === "snap"){ saveSnapshot(); return; }
  if(act === "unseal"){
    if(confirm("The sealed sample is your only unbiased check. Every look at it makes the next one less meaningful.\n\nOpen it?")){
      STATE.lab.revealed = true; STATE.lab.looks++; saveLab(); render();
    }
    return;
  }
  if(act === "labnorm"){
    var on = CONFIG.indicators.filter(function(i){ return STATE.lab.enabled[i.id]; });
    var tot = on.reduce(function(a,i){ return a + Number(STATE.lab.weights[i.id]||0); }, 0);
    if(tot > 0) on.forEach(function(i){
      STATE.lab.weights[i.id] = Math.round(Number(STATE.lab.weights[i.id]||0)*(100/tot)*10)/10;
    });
    saveLab(); render(); return;
  }
  if(act === "labreset"){
    var keep = STATE.lab.recipes, at = STATE.lab.attempts, lk = STATE.lab.looks, rv = STATE.lab.revealed;
    STATE.lab = labDefaults();
    STATE.lab.recipes = keep; STATE.lab.attempts = at; STATE.lab.looks = lk; STATE.lab.revealed = rv;
    saveLab(); render(); return;
  }
  if(act === "labmin"){
    /* three factors, one per underlying driver, chosen on mechanism not fit */
    var trio = {hyoas:true, real10y:true, vterm:true};
    CONFIG.indicators.forEach(function(i){
      STATE.lab.enabled[i.id] = !!trio[i.id];
      if(trio[i.id]) STATE.lab.weights[i.id] = 33.3;
    });
    STATE.lab.attempts++; saveLab(); render(); return;
  }
  if(act === "labsave"){
    var R = runLab();
    if(!R || R.error) return;
    var nm = prompt("Name this recipe:", "recipe " + (STATE.lab.recipes.length+1));
    if(!nm) return;
    STATE.lab.recipes.push({
      name:nm,
      count: CONFIG.indicators.filter(function(i){ return STATE.lab.enabled[i.id]; }).length,
      enabled: JSON.parse(JSON.stringify(STATE.lab.enabled)),
      weights: JSON.parse(JSON.stringify(STATE.lab.weights)),
      train: R.train ? R.train.acc : null,
      val:   R.val   ? R.val.acc   : null,
      spread:R.val   ? R.val.spread: null
    });
    saveLab(); render(); return;
  }
  if(act === "labapply"){
    if(confirm("Copy these weights into the live model? Excluded factors get weight zero.")){
      CONFIG.indicators.forEach(function(i){
        STATE.weights[i.id] = STATE.lab.enabled[i.id] ? Number(STATE.lab.weights[i.id]||0) : 0;
      });
      save(LS.settings, STATE.weights); BT = null; STATE.tab = "overview"; render();
    }
    return;
  }
  var lr = t.getAttribute("data-loadrec");
  if(lr !== null && lr !== undefined){
    var rec = STATE.lab.recipes[Number(lr)];
    if(rec){
      STATE.lab.enabled = JSON.parse(JSON.stringify(rec.enabled));
      STATE.lab.weights = JSON.parse(JSON.stringify(rec.weights));
      saveLab(); render();
    }
    return;
  }
  if(act === "rerun"){ BT = null; render(); return; }
  if(act === "exportbt"){
    if(!BT) BT = runBacktest();
    if(BT && BT.weeks){
      download("mes-backtest.csv",
        "week,score,base,rule_adj,bias,index_start,index_end,next_week_return_pct\n" +
        BT.weeks.map(function(w){
          return [w.date,w.score,w.base,w.adj,'"'+w.band+'"',w.start.toFixed(2),w.end.toFixed(2),w.ret.toFixed(3)].join(",");
        }).join("\n"), "text/csv");
    }
    return;
  }
  if(act === "refresh"){ loadRepoData(true); return; }
  if(act === "fetch"){ loadRepoData(true); return; }
  if(act === "loadfile"){ loadDataFile(); return; }
  if(act === "clearlive"){
    if(confirm("Discard fetched data and fall back to sample values?")) clearLive();
    return;
  }
  if(act === "exportjson"){ exportJSON(); return; }
  if(act === "exportcsv"){ exportCSV(); return; }
  if(act === "import"){ importJSON(); return; }

  if(act === "clear"){
    if(confirm("Delete all " + STATE.snaps.length + " saved weeks? This cannot be undone.")){
      STATE.snaps = []; save(LS.snaps, STATE.snaps); render();
    } return;
  }
  if(act === "clearmanual"){
    if(confirm("Remove every manual override and fall back to sample values?")){
      STATE.manual = {}; save(LS.manual, STATE.manual); render();
    } return;
  }
  if(act === "savew"){ save(LS.settings, STATE.weights); render(); return; }
  if(act === "resetw"){ STATE.weights = defaultWeights(); save(LS.settings, STATE.weights); render(); return; }
  if(act === "normalize"){
    var tot = CONFIG.indicators.reduce(function(a,i){ return a + Number(STATE.weights[i.id]||0); }, 0);
    if(tot > 0){
      CONFIG.indicators.forEach(function(i){
        STATE.weights[i.id] = Math.round(Number(STATE.weights[i.id]||0) * (100/tot) * 10)/10;
      });
      save(LS.settings, STATE.weights); render();
    } return;
  }
  if(act === "savem"){
    var id = t.getAttribute("data-id"), obj = {};
    document.querySelectorAll('[data-m="'+id+'"]').forEach(function(el){
      var v = el.value.trim();
      if(v !== "") obj[el.getAttribute("data-k")] = isNaN(Number(v)) || el.type === "text" && isNaN(Number(v)) ? v : Number(v);
    });
    if(Object.keys(obj).length) STATE.manual[id] = obj; else delete STATE.manual[id];
    save(LS.manual, STATE.manual);
    closeDrawer(); render(); return;
  }
  if(act === "clearm"){
    delete STATE.manual[t.getAttribute("data-id")];
    save(LS.manual, STATE.manual); closeDrawer(); render(); return;
  }

  var del = t.getAttribute("data-del");
  if(del){
    if(confirm("Remove this saved week?")){
      STATE.snaps = STATE.snaps.filter(function(s){ return s.id !== del; });
      save(LS.snaps, STATE.snaps); render();
    } return;
  }

  var ind = t.getAttribute("data-ind");
  if(ind){ drawerFor(ind); return; }
});

document.addEventListener("change", function(e){
  var w = e.target.getAttribute && e.target.getAttribute("data-w");
  if(w){ STATE.weights[w] = Number(e.target.value)||0; save(LS.settings, STATE.weights); BT = null; render(); return; }
  var lb = e.target.getAttribute && e.target.getAttribute("data-lab");
  if(lb){
    STATE.lab.enabled[lb] = !!e.target.checked;
    STATE.lab.attempts++; saveLab(); render(); return;
  }
  var lw = e.target.getAttribute && e.target.getAttribute("data-labw");
  if(lw){
    STATE.lab.weights[lw] = Number(e.target.value)||0;
    STATE.lab.attempts++; saveLab(); render(); return;
  }
  var ef = e.target.getAttribute && e.target.getAttribute("data-endfor");
  if(ef){
    var v = e.target.value.trim();
    STATE.snaps.forEach(function(s){ if(s.id === ef) s.mesEnd = v === "" ? null : Number(v); });
    save(LS.snaps, STATE.snaps); render(); return;
  }
});

document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

function toggleTheme(){
  var d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
  document.getElementById("themeBtn").textContent = d ? "Dark theme" : "Light theme";
  try{ localStorage.setItem("mesrd.theme", d ? "light" : "dark"); }catch(err){}
}
(function initTheme(){
  var s = null;
  try{ s = localStorage.getItem("mesrd.theme"); }catch(err){}
  if(s === "dark"){
    document.documentElement.setAttribute("data-theme","dark");
    document.getElementById("themeBtn").textContent = "Light theme";
  } else {
    document.documentElement.setAttribute("data-theme","light");
  }
})();

render();

/* Pull fred-data.json on open so the page is current before you look at it. */
if(location.protocol === "http:" || location.protocol === "https:") loadRepoData(false);
</script>
