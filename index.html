<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MES Weekly Market Regime</title>
<style>
:root{
  --paper:#f7f7f5; --card:#ffffff; --ink:#1a1c1e; --ink2:#5a6067; --ink3:#8b9198;
  --rule:#dcdfe2; --rule2:#eceef0; --field:#ffffff;
  --pos:#1c7c4a; --posbg:#e6f2ea; --neg:#a8322b; --negbg:#f8e9e8;
  --warn:#8a6212; --warnbg:#faf1de; --flat:#6b7178; --flatbg:#eef0f2;
  --accent:#1f3a5f; --shadow:0 1px 2px rgba(20,24,28,.07);
}
html[data-theme="dark"]{
  --paper:#14171a; --card:#1c2024; --ink:#e8eaec; --ink2:#a3aab1; --ink3:#767d85;
  --rule:#2e343a; --rule2:#23282d; --field:#14171a;
  --pos:#5fbf8a; --posbg:#163024; --neg:#e08b83; --negbg:#341f1e;
  --warn:#d6ad5c; --warnbg:#33290f; --flat:#9aa1a8; --flatbg:#262b30;
  --accent:#9fc2e8; --shadow:none;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
a{color:var(--accent)}
button{font:inherit;color:inherit}

/* header */
header{border-bottom:1px solid var(--rule);background:var(--card)}
.hbar{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:640;letter-spacing:-.01em;margin-right:auto}
.brand span{font-weight:400;color:var(--ink3)}
.tbtn{background:none;border:1px solid var(--rule);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tbtn:hover{border-color:var(--ink3)}
nav{border-bottom:1px solid var(--rule);background:var(--card);overflow-x:auto;-webkit-overflow-scrolling:touch}
.navin{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;white-space:nowrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 11px;cursor:pointer;color:var(--ink2);font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* sample banner */
.banner{background:var(--warnbg);border-bottom:1px solid var(--rule);color:var(--warn);font-size:13px}
.banner div{max-width:1180px;margin:0 auto;padding:8px 16px}

h2{font-size:15px;font-weight:640;margin:28px 0 10px;letter-spacing:-.005em}
h2 .sub{font-weight:400;color:var(--ink3);font-size:13px;margin-left:8px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:20px}
.gauge-wrap{padding:18px 20px 16px}
.scoreline{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.score{font-size:60px;line-height:.92;font-weight:660;letter-spacing:-.03em}
.bias{font-size:19px;font-weight:620;padding-bottom:6px}
.gauge{margin:16px 0 4px;position:relative;height:34px}
.gtrack{position:absolute;top:11px;left:0;right:0;height:8px;border-radius:4px;display:flex;overflow:hidden}
.gseg{height:100%}
.gmark{position:absolute;top:4px;width:3px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-1.5px)}
.gticks{display:flex;justify-content:space-between;color:var(--ink3);font-size:11.5px;margin-top:2px}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--rule2)}
.kv div span{display:block;color:var(--ink3);font-size:11.5px;margin-bottom:2px}
.kv div b{font-size:16px;font-weight:620}

.stack{display:flex;flex-direction:column;gap:14px}
.px{padding:14px 16px}
.pxrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pxrow+.pxrow{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule2)}
.pxlab{color:var(--ink2);font-size:13px}
.pxval{font-size:19px;font-weight:620}
.summary{font-size:14px;line-height:1.62;color:var(--ink2)}
.summary b{color:var(--ink);font-weight:600}

/* contribution bars */
.contrib{padding:6px 16px 14px}
.crow{display:grid;grid-template-columns:132px 1fr 52px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--rule2)}
.crow:first-child{border-top:0}
.clab{font-size:13px;color:var(--ink2)}
.cbar{position:relative;height:16px;background:var(--rule2);border-radius:3px}
.cmid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--rule)}
.cfill{position:absolute;top:0;bottom:0;border-radius:3px}
.cval{text-align:right;font-size:13.5px;font-weight:600}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--rule2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--rule2)}
.iname{font-weight:560}
.isrc{color:var(--ink3);font-size:11.5px;margin-top:2px}
.scroll{overflow-x:auto}

.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:640;white-space:nowrap}
.p-pos{background:var(--posbg);color:var(--pos)}
.p-neg{background:var(--negbg);color:var(--neg)}
.p-flat{background:var(--flatbg);color:var(--flat)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.tpos{color:var(--pos)} .tneg{color:var(--neg)} .tflat{color:var(--ink2)} .twarn{color:var(--warn)}
.stale{color:var(--warn)}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.42);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;z-index:50;background:var(--card);border:1px solid var(--rule);display:none;overflow-y:auto}
.drawer.on{display:block}
@media (min-width:721px){.drawer{top:0;right:0;bottom:0;width:420px;border-radius:0}}
@media (max-width:720px){.drawer{left:0;right:0;bottom:0;max-height:88vh;border-radius:12px 12px 0 0}}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--card)}
.dhead h3{margin:0;font-size:16px;font-weight:640}
.x{background:none;border:1px solid var(--rule);border-radius:5px;width:28px;height:28px;cursor:pointer;color:var(--ink2);line-height:1}
.dbody{padding:16px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:13.5px}
.drow span{color:var(--ink2)}
.why{margin-top:14px;padding:12px 13px;background:var(--rule2);border-radius:6px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.thr{margin-top:14px;font-size:12.5px;color:var(--ink2)}
.thr table{width:100%;border-collapse:collapse;margin-top:6px}
.thr td{padding:4px 6px;border-bottom:1px solid var(--rule2)}
.thr tr.hit{background:var(--rule2);font-weight:640;color:var(--ink)}

/* forms */
label.f{display:block;margin-top:12px;font-size:12.5px;color:var(--ink2)}
input[type=text],input[type=number],textarea,select{
  width:100%;margin-top:4px;padding:8px 9px;border:1px solid var(--rule);border-radius:5px;
  background:var(--field);color:var(--ink);font:inherit;font-size:14px}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 13px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .btn.primary{color:#14171a}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.empty{padding:26px 18px;text-align:center;color:var(--ink2);font-size:13.5px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:620;margin-bottom:4px;font-size:14.5px}
.note{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.55}
.wgrid{display:grid;grid-template-columns:1fr 92px;gap:8px 12px;align-items:center;font-size:13.5px}
.wgrid input{margin-top:0;text-align:right}
.wsum{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-weight:620;font-size:13.5px}
.databar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;margin-top:18px;
  background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);font-size:13px}
.databar .grow{margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.d-live{background:var(--pos)} .d-mix{background:var(--warn)} .d-sample{background:var(--ink3)}
.log{margin-top:12px;font-size:12.5px}
.log table{width:100%;border-collapse:collapse}
.log td{padding:5px 8px;border-bottom:1px solid var(--rule2)}
.log td:last-child{text-align:right}
.spin{opacity:.6}
footer{border-top:1px solid var(--rule);margin-top:44px;padding:18px 0 0;color:var(--ink3);font-size:12px;line-height:1.6}
.hide{display:none}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .score{font-size:50px}
  .crow{grid-template-columns:104px 1fr 46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand">MES Weekly Market Regime <span>/ phase 1</span></div>
    <button class="tbtn" id="themeBtn" type="button">Dark theme</button>
  </div>
</header>

<div class="banner"><div id="bannerTxt">Sample data. Every value below is placeholder input for laying out the interface, not market data. Use Edit value to enter real numbers.</div></div>

<nav><div class="navin" id="tabs" role="tablist"></div></nav>

<div class="wrap" id="view"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail"></aside>

<script>
"use strict";

/* =========================================================================
   CONFIG - single source of truth for categories, indicators, thresholds.
   Nothing in the UI hard-codes a scoring decision; all of it reads from here.
   ========================================================================= */

var CONFIG = {
  bands: [
    {min:  60, max: 101, label:"Strongly Risk-On",    tone:"pos"},
    {min:  20, max:  60, label:"Moderately Risk-On",  tone:"pos"},
    {min: -19, max:  20, label:"Neutral / Mixed",     tone:"flat"},
    {min: -60, max: -19, label:"Moderately Risk-Off", tone:"neg"},
    {min:-101, max: -60, label:"Strongly Risk-Off",   tone:"neg"}
  ],
  categories: [
    {id:"vol",    name:"Volatility"},
    {id:"rates",  name:"Rates / Fed"},
    {id:"macro",  name:"Macro"},
    {id:"credit", name:"Credit / Liquidity"},
    {id:"intern", name:"Market Internals"},
    {id:"other",  name:"Commodities"}
  ],
  /* thresholds: ordered cut points. score applies when driver < max.
     Final entry uses max:null meaning "everything above". */
  /* factor: which latent variable this actually measures. Indicators sharing
     a factor are correlated and must not be treated as independent votes.
     lead: coincident indicators describe the week that just ended; leading
     ones carry at least some forward information. */
  indicators: [
    {id:"vix", cat:"vol", w:12, name:"VIX", driver:"chg5d", unit:"", drvUnit:"%",
     factor:"risk", lead:"coincident",
     drvLabel:"5-day change", src:"Cboe / manual",
     thresholds:[{max:-10,s:2},{max:-3,s:1},{max:3,s:0},{max:10,s:-1},{max:null,s:-2}],
     desc:"Implied 30-day volatility on the S&P 500. Direction matters more than level: a falling VIX usually accompanies rising equities, while a fast spike marks repricing of risk.",
     fields:[["Level","level",""],["Weekly change","chgw","%"]]},

    {id:"vterm", cat:"vol", w:8, name:"VIX term structure", driver:"ratio", unit:"", drvUnit:"x",
     factor:"risk", lead:"leading",
     drvLabel:"VIX / VIX3M", src:"Cboe / manual",
     thresholds:[{max:0.85,s:2},{max:0.95,s:1},{max:1.00,s:0},{max:1.05,s:-1},{max:null,s:-2}],
     desc:"VIX divided by VIX3M. Below 1.0 is contango, the normal state. Above 1.0 is backwardation: near-term risk is priced above longer-dated risk, which historically marks stressed conditions.",
     fields:[["VIX","vix",""],["VIX3M","vix3m",""],["State","state",""]]},

    {id:"ust2y", cat:"rates", w:7, name:"2-Year Treasury", driver:"chgbp", unit:"%", drvUnit:" bps",
     factor:"rates", lead:"leading",
     drvLabel:"Weekly change", src:"FRED DGS2 / manual",
     thresholds:[{max:-15,s:2},{max:-5,s:1},{max:5,s:0},{max:15,s:-1},{max:null,s:-2}],
     desc:"The 2-year tracks expected policy over the next two years. A sharp fall usually means the market is pulling forward rate cuts, which supports valuations unless it is driven by recession fear.",
     fields:[["Yield","level","%"],["Prior week","prev","%"]]},

    {id:"ust10y", cat:"rates", w:5, name:"10-Year Treasury", driver:"chgbp", unit:"%", drvUnit:" bps",
     factor:"rates", lead:"leading",
     drvLabel:"Weekly change", src:"FRED DGS10 / manual",
     thresholds:[{max:-15,s:2},{max:-5,s:1},{max:5,s:0},{max:15,s:-1},{max:null,s:-2}],
     desc:"The long-end discount rate. Rising 10-year yields compress equity multiples; the effect is strongest when the move is fast rather than large.",
     fields:[["Yield","level","%"],["Prior week","prev","%"],["10Y minus 2Y","curve"," bps"]]},

    {id:"real10y", cat:"rates", w:7, name:"10-Year real yield", driver:"chgbp", unit:"%", drvUnit:" bps",
     factor:"rates", lead:"leading",
     drvLabel:"Weekly change", src:"FRED DFII10 / manual",
     thresholds:[{max:-12,s:2},{max:-4,s:1},{max:4,s:0},{max:12,s:-1},{max:null,s:-2}],
     desc:"Nominal yield less inflation compensation. This is the cleanest single read on the discount rate applied to future earnings, which is why it carries more weight than the nominal 10-year.",
     fields:[["Real yield","level","%"],["Prior week","prev","%"]]},

    {id:"fedexp", cat:"rates", w:6, name:"Fed expectations", driver:"cutprob", unit:"", drvUnit:"%",
     factor:"rates", lead:"leading",
     drvLabel:"Implied easing pressure", src:"Derived: 2Y vs policy rate",
     thresholds:[{max:10,s:-1},{max:35,s:0},{max:65,s:1},{max:null,s:2}],
     desc:"How far the 2-year yield sits below the current policy rate, scaled to a rough easing probability. A proxy for futures-implied pricing, which no free feed carries. It moves with the same forces but is not the CME number, so read the direction rather than the level.",
     fields:[["Fed funds target","target","%"],["2Y below target","gap"," bps"],["Hold","holdprob","%"]]},
    {id:"infl", cat:"macro", w:6, name:"Inflation", driver:"trend3m", unit:"", drvUnit:" pp",
     factor:"macro", lead:"lagging",
     drvLabel:"Core CPI trend, 3 months", src:"FRED CPILFESL",
     thresholds:[{max:-0.3,s:2},{max:-0.08,s:1},{max:0.08,s:0},{max:0.3,s:-1},{max:null,s:-2}],
     desc:"Core CPI year-over-year now versus its reading three months ago. Consensus figures are not in any free feed, so this scores the direction of inflation rather than the surprise against expectations. Cooling core is supportive while growth holds up.",
     fields:[["Headline CPI YoY","cpi","%"],["Core CPI YoY","core","%"]]},
    {id:"labor", cat:"macro", w:5, name:"Employment", driver:"claims4w", unit:"", drvUnit:"k",
     factor:"macro", lead:"lagging",
     drvLabel:"4-week average claims", src:"DOL / BLS / manual",
     thresholds:[{max:210,s:1},{max:240,s:0},{max:275,s:-1},{max:null,s:-2}],
     desc:"Initial claims are the highest-frequency labor read. Deterioration is bearish even though it raises easing odds, because earnings follow employment.",
     fields:[["Initial claims","claims","k"],["Nonfarm payrolls","nfp","k"],["Payroll consensus","nfpcons","k"],["Unemployment rate","urate","%"],["Avg hourly earnings YoY","ahe","%"]]},

    {id:"growth", cat:"macro", w:4, name:"Growth", driver:"regional", unit:"", drvUnit:"",
     factor:"macro", lead:"leading",
     drvLabel:"Regional Fed manufacturing", src:"FRED Philadelphia + Empire State",
     thresholds:[{max:-15,s:-2},{max:-3,s:-1},{max:5,s:0},{max:15,s:1},{max:null,s:2}],
     desc:"Average of the Philadelphia Fed and Empire State manufacturing surveys. These are diffusion indexes centered on zero, not fifty. ISM is licensed and unavailable free; these publish earlier in the month and track it closely enough to serve the same role.",
     fields:[["Philadelphia Fed","philly",""],["Empire State","empire",""],["Surveys used","n",""],["GDPNow","gdpnow","%"]]},
    {id:"hyoas", cat:"credit", w:8, name:"High-yield spread", driver:"chgbp", unit:" bps", drvUnit:" bps",
     factor:"risk", lead:"leading",
     drvLabel:"Weekly change", src:"FRED BAMLH0A0HYM2 / manual",
     thresholds:[{max:-20,s:2},{max:-6,s:1},{max:6,s:0},{max:20,s:-1},{max:null,s:-2}],
     desc:"Option-adjusted spread on high-yield credit. Credit usually breaks before equities do, so widening spreads alongside a rising index is a divergence worth respecting.",
     fields:[["HY OAS","level"," bps"],["Prior week","prev"," bps"],["IG spread","ig"," bps"],["IG weekly change","igchg"," bps"]]},

    {id:"fci", cat:"credit", w:7, name:"Financial conditions", driver:"chg", unit:"", drvUnit:"",
     factor:"risk", lead:"coincident",
     drvLabel:"Weekly change in NFCI", src:"Chicago Fed NFCI / manual",
     thresholds:[{max:-0.03,s:2},{max:-0.01,s:1},{max:0.01,s:0},{max:0.03,s:-1},{max:null,s:-2}],
     desc:"Chicago Fed National Financial Conditions Index. Negative readings are looser than average. Easing conditions widen the funding channel that supports risk assets.",
     fields:[["NFCI level","level",""],["Prior week","prev",""]]},

    {id:"trend", cat:"intern", w:7, name:"S&P 500 trend", driver:"maScore", unit:"", drvUnit:" of 3",
     factor:"price", lead:"coincident",
     drvLabel:"Moving averages held", src:"Index data / manual",
     thresholds:[{max:1,s:-2},{max:2,s:-1},{max:3,s:1},{max:null,s:2}],
     desc:"Count of the 20-, 50- and 200-day averages the index is trading above. A blunt but durable trend filter.",
     fields:[["Above 20DMA","ma20",""],["Above 50DMA","ma50",""],["Above 200DMA","ma200",""]]},

    {id:"breadth", cat:"intern", w:10, name:"Breadth", driver:"ratioChg", unit:"", drvUnit:"%",
     factor:"price", lead:"coincident",
     drvLabel:"Equal-weight vs cap-weight, 20d", src:"FRED SP500 + NASDAQNQUS500LCE",
     thresholds:[{max:-2.5,s:-2},{max:-0.8,s:-1},{max:0.8,s:0},{max:2.5,s:1},{max:null,s:2}],
     desc:"Equal-weight S&P divided by cap-weight, changed over twenty sessions. Rising means the average stock is keeping pace with the megacaps. Percent-above-50DMA needs constituent data no free source provides; this captures the same narrow-versus-broad question from index levels alone.",
     fields:[["Basis","adline",""]]},
    {id:"dxy", cat:"intern", w:3, name:"Dollar index", driver:"chgpct", unit:"", drvUnit:"%",
     factor:"price", lead:"coincident",
     drvLabel:"Weekly change", src:"FX data / manual",
     thresholds:[{max:-1.0,s:2},{max:-0.3,s:1},{max:0.3,s:0},{max:1.0,s:-1},{max:null,s:-2}],
     desc:"A rising dollar tightens global funding and trims overseas earnings translation for S&P 500 constituents.",
     fields:[["DXY","level",""],["Prior week","prev",""]]},

    {id:"oil", cat:"other", w:5, name:"Crude oil", driver:"chgpct", unit:"", drvUnit:"%",
     factor:"macro", lead:"coincident",
     drvLabel:"Weekly change", src:"EIA / manual",
     thresholds:[{max:-8,s:-1},{max:-3,s:1},{max:3,s:0},{max:8,s:-1},{max:null,s:-2}],
     desc:"Read as an inflation-pressure gauge rather than a growth proxy. Both a sharp spike and a collapse score negatively: the first is a cost shock, the second usually signals demand loss.",
     fields:[["WTI","level","$"],["Prior week","prev","$"],["Copper","copper","$"],["Gold","gold","$"]]}
  ],
  eventRisk: {highEventsForHigh:1, mediumEventsForMedium:2, confidencePenalty:{HIGH:14, MEDIUM:6, LOW:0}},

  /* Cross-indicator rules. A weighted average treats every indicator as an
     independent vote, which is wrong: the same conditions mean different
     things in combination. Each rule reads the scored indicators and adds a
     transparent adjustment in score points. Adjustments are capped so the
     rules can shade a reading, never manufacture one. */
  rules: [
    {id:"false-easing", name:"Easing driven by deterioration", adj:-14,
     when:function(g){ return g.real10y <= -1 && g.hyoas <= -1 && g.labor <= -1; },
     why:"Falling real yields alongside widening credit spreads and softening labour is the recession pattern, not the soft-landing one. Rates turning supportive here is a symptom, not a tailwind."},

    {id:"complacency", name:"Low volatility, narrow market", adj:-8,
     when:function(g){ return g.vix >= 1 && g.breadth <= -1; },
     why:"A calm VIX while the average stock lags the index is complacency rather than strength. Falling volatility earns less credit when breadth is not confirming."},

    {id:"confirmation", name:"Trend confirmed by credit and breadth", adj:+10,
     when:function(g){ return g.trend >= 1 && g.hyoas >= 1 && g.breadth >= 1; },
     why:"Price, credit and participation all pointing the same way is the one combination that historically persists. Independent confirmation deserves more than the sum of three separate votes."},

    {id:"credit-divergence", name:"Credit diverging from price", adj:-10,
     when:function(g){ return g.trend >= 1 && g.hyoas <= -1; },
     why:"Credit usually cracks before equities. An index holding its averages while high-yield spreads widen is a divergence worth respecting."},

    {id:"growth-vs-rates", name:"Growth strong, real yields rising fast", adj:+5,
     when:function(g){ return g.growth >= 1 && g.real10y <= -1; },
     why:"Rising real yields are less threatening when they reflect genuine growth rather than policy tightening into weakness. The rates penalty is partly refunded."},

    {id:"stress", name:"Backwardation with widening credit", adj:-12,
     when:function(g){ return g.vterm <= -1 && g.hyoas <= -1; },
     why:"Inverted volatility term structure together with widening spreads is the signature of genuine stress rather than an ordinary pullback."}
  ],
  ruleCap: 24,

  /* Number of independent factors the indicator set can draw on. */
  factorCount: 4,

  /* Weekly index direction is close to unforecastable. Anything presenting
     itself as more certain than this is lying to you. */
  confidenceCeiling: 75,

  /* Share of weeks the index closes up, long run. The benchmark any
     directional model has to beat. Recomputed from your own snapshots once
     there are enough of them; this is only the prior. */
  baseRateUp: 0.56
};

/* =========================================================================
   FRED - series pulled, and how they map onto indicator fields.
   Everything here is free-tier FRED with one API key. Four indicators have
   no FRED equivalent and stay on manual entry; they are listed in NO_FRED.
   ========================================================================= */

var FRED = {
  base: "https://api.stlouisfed.org/fred/series/observations",
  series: {
    VIXCLS:{n:2600}, VXVCLS:{n:2600},
    DGS2:{n:2600}, DGS10:{n:2600}, DFII10:{n:2600},
    DFEDTARU:{n:2600},
    CPIAUCSL:{n:140}, CPILFESL:{n:140},
    ICSA:{n:540}, PAYEMS:{n:130}, UNRATE:{n:130}, CES0500000003:{n:140},
    GDPNOW:{n:60},
    BAMLH0A0HYM2:{n:2600}, BAMLC0A0CM:{n:2600},
    NFCI:{n:540},
    SP500:{n:2600}, NASDAQNQUS500LCE:{n:2600},
    DTWEXBGS:{n:2600}, DCOILWTICO:{n:2600},
    GACDISA066MSFRBPHI:{n:130}, GACDISA066MSFRBNY:{n:130}
  }
};

/* Indicators that are substitutes rather than the textbook measure. Shown in
   the drawer so a proxy is never mistaken for the real series. */
var NO_FRED = {
  fedexp:  "Proxy. True futures-implied pricing needs CME data, which is not free.",
  growth:  "Substitute for ISM, which is licensed and absent from every free feed.",
  infl:    "Scores the trend in core CPI. No free feed publishes the consensus a surprise would need.",
  breadth: "Substitute for percent-above-50DMA, which needs constituent-level data."
};

/* last N clean numeric observations, newest first.
   cutoff (YYYY-MM-DD) hides everything after that date, which is what makes
   historical replay possible without leaking future data into a past score. */
function obs(S, id, cutoff){
  var a = S[id];
  if(!a || !a.length) return [];
  return a.filter(function(o){
            if(o.value === "." || o.value === "" || isNaN(Number(o.value))) return false;
            return cutoff ? o.date <= cutoff : true;
          })
          .map(function(o){ return {d:o.date, v:Number(o.value)}; })
          .sort(function(x,y){ return x.d < y.d ? 1 : -1; });
}
function last(S, id, c){ var a = obs(S,id,c); return a.length ? a[0].v : null; }
function back(S, id, k, c){ var a = obs(S,id,c); return a.length > k ? a[k].v : null; }
function dateOf(S, id, c){ var a = obs(S,id,c); return a.length ? a[0].d + "T16:00:00" : null; }
function delta(S, id, k, c){
  var a = last(S,id,c), b = back(S,id,k,c);
  return (a===null||b===null) ? null : a-b;
}
function pctChg(S, id, k, c){
  var a = last(S,id,c), b = back(S,id,k,c);
  return (a===null||b===null||b===0) ? null : Math.round((a-b)/b*1000)/10;
}
function yoy(S, id, c){
  var a = obs(S,id,c);
  if(a.length < 13) return null;
  return Math.round((a[0].v - a[12].v)/a[12].v * 1000)/10;
}
function ma(S, id, n, c){
  var a = obs(S,id,c);
  if(a.length < n) return null;
  var s = 0; for(var i=0;i<n;i++) s += a[i].v;
  return s/n;
}
function r2(x){ return x===null||x===undefined ? null : Math.round(x*100)/100; }

/* Map raw FRED series onto the indicator value shapes the engine expects.
   Pass a cutoff date to reconstruct what these values were on that date. */
function derive(S, c){
  var out = {}, spx = last(S,"SP500",c);

  if(last(S,"VIXCLS",c) !== null)
    out.vix = {level:last(S,"VIXCLS",c), chg5d:pctChg(S,"VIXCLS",5,c), chgw:pctChg(S,"VIXCLS",5,c), updated:dateOf(S,"VIXCLS",c)};

  if(last(S,"VIXCLS",c) !== null && last(S,"VXVCLS",c) !== null){
    var rr = r2(last(S,"VIXCLS",c)/last(S,"VXVCLS",c));
    out.vterm = {ratio:rr, vix:last(S,"VIXCLS",c), vix3m:last(S,"VXVCLS",c),
                 state: rr < 1 ? "Contango" : "Backwardation", updated:dateOf(S,"VXVCLS",c)};
  }
  if(last(S,"DGS2",c) !== null)
    out.ust2y = {level:last(S,"DGS2",c), prev:back(S,"DGS2",5,c),
                 chgbp:Math.round(delta(S,"DGS2",5,c)*100), updated:dateOf(S,"DGS2",c)};

  if(last(S,"DGS10",c) !== null){
    var curve = (last(S,"DGS10",c)!==null && last(S,"DGS2",c)!==null)
      ? Math.round((last(S,"DGS10",c)-last(S,"DGS2",c))*100) : null;
    out.ust10y = {level:last(S,"DGS10",c), prev:back(S,"DGS10",5,c),
                  chgbp:Math.round(delta(S,"DGS10",5,c)*100), curve:curve, updated:dateOf(S,"DGS10",c)};
  }
  if(last(S,"DFII10",c) !== null)
    out.real10y = {level:last(S,"DFII10",c), prev:back(S,"DFII10",5,c),
                   chgbp:Math.round(delta(S,"DFII10",5,c)*100), updated:dateOf(S,"DFII10",c)};

  /* Cut probability is derived from the 2-year yield's move relative to the
     current policy rate. This is a proxy, not futures-implied pricing: when
     the 2-year sits well below the target, the market is pricing easing. */
  var t = last(S,"DFEDTARU",c), y2 = last(S,"DGS2",c);
  if(t !== null && y2 !== null){
    var gap = (t - 0.125) - y2;                 /* target midpoint minus 2y */
    var prob = Math.max(0, Math.min(100, Math.round(gap / 0.5 * 100)));
    out.fedexp = {cutprob:prob, target:t, holdprob:100-prob, hikeprob:0,
                  gap:Math.round(gap*100), updated:dateOf(S,"DGS2",c)};
  }

  var cpi = yoy(S,"CPIAUCSL",c), core = yoy(S,"CPILFESL",c);
  if(cpi !== null){
    /* No consensus feed exists, so score the trend in core instead of the
       surprise: core YoY now versus three months ago. */
    var ca = obs(S,"CPILFESL",c), trend = null;
    if(ca.length >= 16){
      var nowY = (ca[0].v - ca[12].v)/ca[12].v*100;
      var oldY = (ca[3].v - ca[15].v)/ca[15].v*100;
      trend = Math.round((nowY - oldY)*100)/100;
    }
    out.infl = {cpi:cpi, core:core, trend3m:trend, updated:dateOf(S,"CPIAUCSL",c)};
  }

  if(last(S,"ICSA",c) !== null){
    var cl = obs(S,"ICSA",c), avg4 = null;
    if(cl.length >= 4) avg4 = Math.round((cl[0].v+cl[1].v+cl[2].v+cl[3].v)/4/1000);
    var p = obs(S,"PAYEMS",c);
    out.labor = {claims:Math.round(cl[0].v/1000), claims4w:avg4,
                 nfp: p.length>1 ? Math.round(p[0].v - p[1].v) : null,
                 urate:last(S,"UNRATE",c), ahe:yoy(S,"CES0500000003",c),
                 updated:dateOf(S,"ICSA",c)};
  }

  /* Growth: average of whichever regional Fed manufacturing surveys returned.
     These publish before ISM, are free, and track it closely. */
  var reg = [], regIds = ["GACDISA066MSFRBPHI","GACDISA066MSFRBNY"];
  regIds.forEach(function(id){ var v = last(S,id,c); if(v !== null) reg.push(v); });
  if(reg.length){
    var mean = reg.reduce(function(a,b){ return a+b; },0)/reg.length;
    out.growth = {regional:r2(mean), n:reg.length,
                  philly:last(S,"GACDISA066MSFRBPHI",c), empire:last(S,"GACDISA066MSFRBNY",c),
                  gdpnow:last(S,"GDPNOW",c), updated:dateOf(S,regIds[0],c)};
  } else if(last(S,"GDPNOW",c) !== null){
    out.growth = {gdpnow:last(S,"GDPNOW",c), updated:dateOf(S,"GDPNOW",c)};
  }

  if(last(S,"BAMLH0A0HYM2",c) !== null)
    out.hyoas = {level:Math.round(last(S,"BAMLH0A0HYM2",c)*100), prev:Math.round(back(S,"BAMLH0A0HYM2",5,c)*100),
                 chgbp:Math.round(delta(S,"BAMLH0A0HYM2",5,c)*100),
                 ig: last(S,"BAMLC0A0CM",c)===null?null:Math.round(last(S,"BAMLC0A0CM",c)*100),
                 igchg: delta(S,"BAMLC0A0CM",5,c)===null?null:Math.round(delta(S,"BAMLC0A0CM",5,c)*100),
                 updated:dateOf(S,"BAMLH0A0HYM2",c)};

  if(last(S,"NFCI",c) !== null)
    out.fci = {level:last(S,"NFCI",c), prev:back(S,"NFCI",1,c), chg:r2(delta(S,"NFCI",1,c)), updated:dateOf(S,"NFCI",c)};

  if(spx !== null){
    var m20 = ma(S,"SP500",20,c), m50 = ma(S,"SP500",50,c), m200 = ma(S,"SP500",200,c);
    var n = 0;
    if(m20 !== null && spx > m20) n++;
    if(m50 !== null && spx > m50) n++;
    if(m200 !== null && spx > m200) n++;
    out.trend = {maScore: (m200===null?null:n),
                 ma20: m20===null?null:(spx>m20?"Yes":"No"),
                 ma50: m50===null?null:(spx>m50?"Yes":"No"),
                 ma200: m200===null?null:(spx>m200?"Yes":"No"),
                 updated:dateOf(S,"SP500",c)};

    /* Breadth proxy: equal-weight versus cap-weight S&P, 20-session change.
       Rising means the average stock is keeping up with the megacaps. */
    var ew = last(S,"NASDAQNQUS500LCE",c);
    if(ew !== null){
      var rNow = ew/spx, ewB = back(S,"NASDAQNQUS500LCE",20,c), spB = back(S,"SP500",20,c);
      if(ewB !== null && spB !== null && spB !== 0){
        out.breadth = {ratioChg: Math.round((rNow/(ewB/spB) - 1)*10000)/100,
                       adline:"equal-weight vs cap-weight", updated:dateOf(S,"SP500",c)};
      }
    }
  }
  if(last(S,"DTWEXBGS",c) !== null)
    out.dxy = {level:r2(last(S,"DTWEXBGS",c)), prev:r2(back(S,"DTWEXBGS",5,c)),
               chgpct:pctChg(S,"DTWEXBGS",5,c), updated:dateOf(S,"DTWEXBGS",c)};

  if(last(S,"DCOILWTICO",c) !== null)
    out.oil = {level:last(S,"DCOILWTICO",c), prev:back(S,"DCOILWTICO",5,c),
               chgpct:pctChg(S,"DCOILWTICO",5,c), updated:dateOf(S,"DCOILWTICO",c)};

  var index = null;
  if(spx !== null){
    index = {spx:spx, prev:back(S,"SP500",5,c), chg:pctChg(S,"SP500",5,c), asOf:dateOf(S,"SP500",c)};
  }
  return {values:out, index:index};
}

/* =========================================================================
   BASELINE
   No sample market data. Indicators with nothing fetched and nothing entered
   score null and drop out of the model, which the engine renormalizes for.
   Inventing plausible-looking prices would be worse than showing a gap.
   The calendar holds release dates only; figures come from the release.
   ========================================================================= */

var MOCK = {
  mes: {price:null, weekChg:null, asOf:null},
  values: {},
  calendar: [
    {date:"2026-09-10", time:"08:30", name:"PPI",                    prev:"", cons:"", actual:"", imp:"Medium"},
    {date:"2026-09-10", time:"08:30", name:"Initial Jobless Claims", prev:"", cons:"", actual:"", imp:"Medium"},
    {date:"2026-09-11", time:"08:30", name:"CPI",                    prev:"", cons:"", actual:"", imp:"High"},
    {date:"2026-09-11", time:"08:30", name:"Core CPI",               prev:"", cons:"", actual:"", imp:"High"},
    {date:"2026-09-15", time:"08:30", name:"Retail Sales",           prev:"", cons:"", actual:"", imp:"Medium"},
    {date:"2026-09-16", time:"14:00", name:"FOMC Decision",          prev:"", cons:"", actual:"", imp:"High"},
    {date:"2026-09-16", time:"14:30", name:"Fed Chair Press Conf.",  prev:"", cons:"", actual:"", imp:"High"},
    {date:"2026-09-17", time:"08:30", name:"Initial Jobless Claims", prev:"", cons:"", actual:"", imp:"Medium"}
  ]
};

/* =========================================================================
   STATE + STORAGE
   ========================================================================= */

var LS = {settings:"mesrd.settings.v1", manual:"mesrd.manual.v1", snaps:"mesrd.snapshots.v1",
          live:"mesrd.live.v1", key:"mesrd.fredkey.v1"};

function load(k, fb){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }catch(e){ return fb; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

var STATE = {
  tab: "overview",
  weights: load(LS.settings, null) || defaultWeights(),
  manual: load(LS.manual, {}),
  snaps: load(LS.snaps, []),
  live: load(LS.live, null),          /* {fetched, values, index, log} */
  lab: load("mesrd.lab.v1", null),
  key: load(LS.key, ""),
  fetching: false
};
if(!STATE.lab) STATE.lab = labDefaults();

function defaultWeights(){
  var w = {};
  CONFIG.indicators.forEach(function(i){ w[i.id] = i.w; });
  return w;
}

/* Resolution order: manual entry > fetched FRED value > sample.
   Sample values are only used for fields no real source has supplied. */
function valueOf(id){
  var merged = {}, src = "sample";
  var samp = MOCK.values[id] || {};
  Object.keys(samp).forEach(function(k){ merged[k] = samp[k]; });

  var liveVals = STATE.live && STATE.live.values ? STATE.live.values[id] : null;
  if(liveVals){
    Object.keys(liveVals).forEach(function(k){
      if(liveVals[k] !== null && liveVals[k] !== undefined) { merged[k] = liveVals[k]; src = "live"; }
    });
  }
  var man = STATE.manual[id];
  if(man){
    Object.keys(man).forEach(function(k){
      if(man[k] !== "" && man[k] !== null && man[k] !== undefined) { merged[k] = man[k]; src = "manual"; }
    });
  }
  return {v:merged, manual:src === "manual", src:src};
}

/* Index level and weekly change: fetched if present, otherwise the sample. */
function priceInfo(){
  if(STATE.live && STATE.live.index && STATE.live.index.spx !== null){
    return {price:STATE.live.index.spx, weekChg:STATE.live.index.chg,
            asOf:STATE.live.index.asOf, label:"S&P 500 index", live:true};
  }
  return {price:null, weekChg:null, asOf:null, label:"S&P 500 index", live:false};
}

/* How much of the model is running on real data right now. */
function coverageState(){
  var live = 0, man = 0, samp = 0;
  CONFIG.indicators.forEach(function(i){
    var s = valueOf(i.id).src;
    if(s === "live") live++; else if(s === "manual") man++; else samp++;
  });
  return {live:live, manual:man, sample:samp, total:CONFIG.indicators.length};
}

/* =========================================================================
   SCORING ENGINE (Phase 1 stub)
   Threshold lookup only. The cross-indicator rules engine described in the
   spec is Phase 2 and is deliberately not implemented here.
   ========================================================================= */

function scoreOf(ind, driverVal){
  if(driverVal === null || driverVal === undefined || driverVal === "" || isNaN(Number(driverVal))) return null;
  var x = Number(driverVal);
  for(var i=0;i<ind.thresholds.length;i++){
    var t = ind.thresholds[i];
    if(t.max === null || x < t.max) return t.s;
  }
  return 0;
}

/* Score an arbitrary set of indicator values. getVals(id) -> {v, src}.
   compute() runs it against live state; the backtest runs it against
   reconstructed history using exactly the same code path. */
function scoreSet(getVals, opts){
  opts = opts || {};
  var W = opts.weights || STATE.weights;
  var EN = opts.enabled || null;          /* null means every indicator */
  var rows = [], totalW = 0;
  CONFIG.indicators.forEach(function(ind){
    var got = getVals(ind.id) || {v:{}, src:"none"};
    var drv = got.v[ind.driver];
    var sc = (EN && !EN[ind.id]) ? null : scoreOf(ind, drv);
    var w = Number(W[ind.id] || 0);
    rows.push({ind:ind, val:got.v, manual:got.src === "manual", src:got.src,
               driver:drv, score:sc, weight:w,
               contrib: sc === null ? 0 : (sc/2) * w});
    if(sc !== null) totalW += w;
  });

  var raw = rows.reduce(function(a,r){ return a + r.contrib; }, 0);
  var base = totalW > 0 ? Math.round(raw * (100/totalW)) : 0;

  /* cross-indicator adjustments */
  var g = {};
  rows.forEach(function(r){ g[r.ind.id] = r.score === null ? 0 : r.score; });
  var fired = [], adj = 0;
  (opts.noRules ? [] : CONFIG.rules).forEach(function(rule){
    var hit = false;
    try{ hit = rule.when(g); }catch(e){ hit = false; }
    if(hit){ fired.push(rule); adj += rule.adj; }
  });
  adj = Math.max(-CONFIG.ruleCap, Math.min(CONFIG.ruleCap, adj));

  var total = Math.max(-100, Math.min(100, base + adj));

  var cats = CONFIG.categories.map(function(c){
    var sub = rows.filter(function(r){ return r.ind.cat === c.id; });
    var cw = sub.reduce(function(a,r){ return a + (r.score===null?0:r.weight); }, 0);
    var craw = sub.reduce(function(a,r){ return a + r.contrib; }, 0);
    return {id:c.id, name:c.name, weight:cw,
            points: totalW>0 ? Math.round(craw*(100/totalW)) : 0,
            rows:sub};
  });

  return {rows:rows, base:base, adj:adj, rules:fired, total:total, cats:cats,
          availW:totalW,
          band:bandFor(total),
          event: opts.skipEvents ? "LOW" : eventRisk(),
          confidence: opts.skipEvents ? null : confidence(rows, totalW)};
}

function compute(){ return scoreSet(valueOf); }

function bandFor(x){
  for(var i=0;i<CONFIG.bands.length;i++){
    var b = CONFIG.bands[i];
    if(x >= b.min && x < b.max) return b;
  }
  return CONFIG.bands[2];
}

function eventRisk(){
  var soon = upcoming(7);
  var high = soon.filter(function(e){ return e.imp === "High"; }).length;
  var med  = soon.filter(function(e){ return e.imp === "Medium"; }).length;
  if(high >= CONFIG.eventRisk.highEventsForHigh) return "HIGH";
  if(med  >= CONFIG.eventRisk.mediumEventsForMedium) return "MEDIUM";
  return "LOW";
}

function upcoming(days){
  var now = nowRef();
  var end = new Date(now.getTime() + days*864e5);
  return MOCK.calendar.filter(function(e){
    var d = new Date(e.date + "T12:00:00");
    return d >= now && d <= end;
  });
}

/* Confidence.

   Agreement is measured ACROSS FACTORS, not across indicators. Four risk-
   appetite gauges pointing the same way is one observation repeated, not
   four confirmations, so each factor is collapsed to a single weighted
   position first. Agreement among independent factors is real corroboration;
   agreement within a factor is not, and no longer raises confidence.

   Stale inputs are penalised: a monthly series that has not been revised
   contributes the same score every week without carrying new information. */
function confidence(rows, availW){
  var scored = rows.filter(function(r){ return r.score !== null; });
  if(!scored.length) return 0;
  var totalW = CONFIG.indicators.reduce(function(a,i){ return a + Number(STATE.weights[i.id]||0); }, 0);
  var coverage = totalW > 0 ? availW/totalW : 0;

  /* collapse to one net position per factor */
  var F = {};
  scored.forEach(function(r){
    var f = r.ind.factor || "other";
    if(!F[f]) F[f] = {w:0, c:0};
    F[f].w += r.weight;
    F[f].c += r.contrib;
  });
  var keys = Object.keys(F);
  var net = scored.reduce(function(a,r){ return a + r.contrib; }, 0);
  var dir = net >= 0 ? 1 : -1;

  var agreeW = 0, sumW = 0;
  keys.forEach(function(k){
    sumW += F[k].w;
    if(F[k].c === 0) agreeW += F[k].w*0.5;
    else if((F[k].c > 0 ? 1 : -1) === dir) agreeW += F[k].w;
  });
  var agreement = sumW > 0 ? agreeW/sumW : 0.5;

  /* independent factors actually contributing: more is better */
  var breadthOfEvidence = Math.min(1, keys.length / CONFIG.factorCount);

  /* staleness: weight-share of inputs older than their useful shelf life */
  var freshW = 0, allW = 0;
  scored.forEach(function(r){
    allW += r.weight;
    var a = ago(r.val.updated);
    if(!a.stale) freshW += r.weight;
  });
  var freshness = allW > 0 ? freshW/allW : 1;

  var c = 100 * (0.40*agreement + 0.25*coverage + 0.20*breadthOfEvidence + 0.15*freshness);
  c -= CONFIG.eventRisk.confidencePenalty[eventRisk()] || 0;

  /* Hard ceiling. Weekly index direction is close to unforecastable; a model
     of this kind should never present itself as highly confident. */
  return Math.max(0, Math.min(CONFIG.confidenceCeiling, Math.round(c)));
}

/* =========================================================================
   SUMMARY TEXT - deterministic, no generative call
   ========================================================================= */

function summaryText(M){
  var scored = M.rows.filter(function(r){ return r.score !== null; });
  var byC = scored.slice().sort(function(a,b){ return b.contrib - a.contrib; });
  var up = byC.filter(function(r){ return r.contrib > 0; }).slice(0,3);
  var dn = byC.filter(function(r){ return r.contrib < 0; }).slice(-3).reverse();

  var tone = M.total >= 20 ? "supportive" : M.total <= -20 ? "unsupportive" : "mixed";
  var out = "Conditions read as <b>" + esc(M.band.label.toLowerCase()) + "</b>, with a score of " +
            sgn(M.total) + " out of 100. The overall balance of indicators is " + tone + " for equities. ";
  if(up.length) out += "Supporting the score: " + list(up.map(function(r){ return r.ind.name.toLowerCase(); })) + ". ";
  if(dn.length) out += "Weighing against it: " + list(dn.map(function(r){ return r.ind.name.toLowerCase(); })) + ". ";
  var miss = M.rows.length - scored.length;
  if(miss > 0) out += miss + " indicator" + (miss>1?"s have":" has") + " no value entered, which lowers confidence. ";
  var hi = upcoming(7).filter(function(e){ return e.imp==="High"; });
  if(hi.length) out += "Event risk is " + M.event.toLowerCase() + ": " + list(hi.slice(0,3).map(function(e){ return e.name; })) + " land inside the coming week.";
  else out += "No high-impact releases fall inside the coming week.";
  return out;
}

function list(a){
  if(a.length === 1) return esc(a[0]);
  if(a.length === 2) return esc(a[0]) + " and " + esc(a[1]);
  return a.slice(0,-1).map(esc).join(", ") + " and " + esc(a[a.length-1]);
}

/* =========================================================================
   HELPERS
   ========================================================================= */

function esc(s){ return String(s===null||s===undefined?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function sgn(n){ if(n===null||n===undefined||n==="") return "--"; var v=Number(n); return (v>0?"+":"") + v; }
function sgnf(n,d){ if(n===null||n===undefined||n==="") return "--"; var v=Number(n); return (v>0?"+":"") + v.toFixed(d===undefined?2:d); }
function tone(s){ return s===null?"flat":s>0?"pos":s<0?"neg":"flat"; }
function toneCls(s){ return "t" + tone(s); }
function pillCls(s){ return "pill p-" + tone(s); }

/* Reference "now": the real clock once anything has been fetched, otherwise
   the sample timestamp, so sample data does not read as years stale. */
function nowRef(){ return new Date(); }

function ago(iso){
  if(!iso) return {txt:"no timestamp", stale:true};
  var t = new Date(iso), now = nowRef();
  var m = Math.round((now - t)/60000);
  if(isNaN(m)) return {txt:String(iso), stale:false};
  if(m < 60) return {txt:m + " min ago", stale:false};
  var h = Math.round(m/60);
  if(h < 36) return {txt:h + " hr ago", stale:false};
  var d = Math.round(h/24);
  return {txt:d + " days ago", stale:d > 8};
}

function fmt(v, unit){
  if(v === null || v === undefined || v === "") return "--";
  if(isNaN(Number(v))) return esc(v);
  var n = Number(v);
  var s = (Math.abs(n) >= 1000) ? n.toLocaleString("en-US") :
          (Math.abs(n) >= 100 ? n.toFixed(Math.abs(n%1)>0?1:0) : n.toFixed(2).replace(/\.00$/,""));
  if(unit === "$") return "$" + s;
  return s + (unit || "");
}
function drv(r){
  if(r.driver === null || r.driver === undefined || r.driver === "") return "--";
  if(isNaN(Number(r.driver))) return esc(r.driver);
  var u = r.ind.drvUnit || "";
  var signed = /change|surprise|probability/i.test(r.ind.drvLabel) && !/of 3|composite|percent above/i.test(r.ind.drvLabel);
  var n = Number(r.driver);
  var body = signed ? (n>0?"+":"") + n : String(n);
  return body + u;
}

/* =========================================================================
   BACKTEST
   Replays the model over the fetched FRED history. For each past Friday it
   rebuilds every indicator using only observations dated on or before that
   day, scores it with the current weights and rules, then measures the
   following week's index return. This is what tells you whether the score
   has any predictive value - snapshots alone would take two years to answer.

   Two honest limits. FRED carries revised data, so a revised macro series
   was not what you would have seen live; the daily market series (VIX,
   yields, spreads, index) are not revised and carry most of the weight.
   And the weights being tested are the ones you set, so a good result on
   weights chosen after seeing this history is not evidence.
   ========================================================================= */

var BT = null;

function runBacktest(cfg){
  cfg = cfg || {};
  var ck = JSON.stringify([cfg.weights||null, cfg.enabled||null, !!cfg.noRules]);
  if(BTC[ck]) return BTC[ck];
  if(!STATE.live || !STATE.live.series){ return null; }
  var S = STATE.live.series;
  var spx = obs(S, "SP500");
  if(spx.length < 120) return {error:"Not enough index history. The fetcher needs a longer window."};

  /* weekly cut points: every Friday (or last session of each week) */
  var byWeek = {}, i;
  for(i=0;i<spx.length;i++){
    var d = new Date(spx[i].d + "T12:00:00");
    var yr = d.getUTCFullYear();
    var wk = Math.floor((d - new Date(Date.UTC(yr,0,1))) / 604800000);
    var key = yr + "-" + (wk<10?"0":"") + wk;
    if(!byWeek[key] || spx[i].d > byWeek[key].d) byWeek[key] = spx[i];
  }
  var weeks = Object.keys(byWeek).sort().map(function(k){ return byWeek[k]; });

  var out = [];
  for(i=0;i<weeks.length-1;i++){
    var cut = weeks[i].d;
    var vals = derive(S, cut).values;
    var scored = scoreSet(function(id){
      return vals[id] ? {v:vals[id], src:"live"} : {v:{}, src:"none"};
    }, {skipEvents:true, weights:cfg.weights, enabled:cfg.enabled, noRules:cfg.noRules});

    if(scored.availW < (cfg.minWeight === undefined ? 40 : cfg.minWeight)) continue;

    var start = weeks[i].v, end = weeks[i+1].v;
    var ret = (end - start)/start*100;
    out.push({date:cut, score:scored.total, base:scored.base, adj:scored.adj,
              band:scored.band.label, tone:scored.band.tone,
              start:start, end:end, ret:ret,
              rows:scored.rows.map(function(r){ return {id:r.ind.id, score:r.score}; })});
  }
  if(out.length < 12) return {error:"Only " + out.length + " usable weeks. Fetch a longer history."};
  var res = {weeks:out, stats:btStats(out), indicators:btIndicators(out)};
  BTC[ck] = res;
  return res;
}

function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }
function median(a){
  if(!a.length) return null;
  var b = a.slice().sort(function(x,y){ return x-y; });
  var m = Math.floor(b.length/2);
  return b.length%2 ? b[m] : (b[m-1]+b[m])/2;
}
function corr(x, y){
  var n = x.length; if(n < 3) return null;
  var mx = mean(x), my = mean(y), sx = 0, sy = 0, sxy = 0;
  for(var i=0;i<n;i++){ var a = x[i]-mx, b = y[i]-my; sxy += a*b; sx += a*a; sy += b*b; }
  return (sx===0||sy===0) ? null : Math.round(sxy/Math.sqrt(sx*sy)*1000)/1000;
}

function btStats(w){
  var rets = w.map(function(r){ return r.ret; });
  var directional = w.filter(function(r){ return Math.abs(r.score) >= 20; });
  var hits = directional.filter(function(r){
    return (r.score > 0 && r.ret > 0) || (r.score < 0 && r.ret < 0);
  });
  var on  = w.filter(function(r){ return r.score >= 20; });
  var off = w.filter(function(r){ return r.score <= -20; });
  var neu = w.filter(function(r){ return Math.abs(r.score) < 20; });

  var buckets = [[60,101],[40,60],[20,40],[-20,20],[-40,-20],[-60,-40],[-101,-60]].map(function(b){
    var g = w.filter(function(r){ return r.score >= b[0] && r.score < b[1]; });
    return {lo:b[0], hi:b[1], n:g.length,
            avg: g.length ? mean(g.map(function(r){ return r.ret; })) : null,
            pos: g.length ? g.filter(function(r){ return r.ret > 0; }).length/g.length*100 : null};
  });

  return {
    n:w.length, from:w[0].date, to:w[w.length-1].date,
    directional:directional.length,
    hitRate: directional.length ? hits.length/directional.length*100 : null,
    bullN:on.length,  bullAvg: on.length ? mean(on.map(function(r){return r.ret;})) : null,
    bearN:off.length, bearAvg: off.length ? mean(off.map(function(r){return r.ret;})) : null,
    neuN:neu.length,  neuAvg: neu.length ? mean(neu.map(function(r){return r.ret;})) : null,
    allAvg: mean(rets), allMed: median(rets),
    posWeeks: w.filter(function(r){ return r.ret > 0; }).length/w.length*100,
    corr: corr(w.map(function(r){ return r.score; }), rets),
    buckets:buckets
  };
}

/* Per-indicator: does this one, on its own, say anything about next week? */
function btIndicators(w){
  return CONFIG.indicators.map(function(ind){
    var xs = [], ys = [], byScore = {};
    w.forEach(function(week){
      var r = week.rows.filter(function(x){ return x.id === ind.id; })[0];
      if(!r || r.score === null) return;
      xs.push(r.score); ys.push(week.ret);
      (byScore[r.score] = byScore[r.score] || []).push(week.ret);
    });
    var directional = xs.filter(function(v,i){ return v !== 0; });
    var hits = 0, dn = 0;
    xs.forEach(function(v,i){
      if(v === 0) return;
      dn++;
      if((v > 0 && ys[i] > 0) || (v < 0 && ys[i] < 0)) hits++;
    });
    return {id:ind.id, name:ind.name, n:xs.length,
            corr: corr(xs, ys),
            hit: dn ? hits/dn*100 : null,
            avg: [2,1,0,-1,-2].map(function(k){
              return {k:k, n:(byScore[k]||[]).length, avg: byScore[k] ? mean(byScore[k]) : null};
            })};
  }).filter(function(r){ return r.n > 0; })
    .sort(function(a,b){ return Math.abs(b.corr||0) - Math.abs(a.corr||0); });
}

/* =========================================================================
   OPTIMIZER
   Searches weight vectors, but the search is not the point. The point is the
   three numbers it reports alongside the result:

     in-sample vs out-of-sample  - the gap is the overfitting measure
     always-long benchmark       - what you beat by doing nothing
     permutation percentile      - where the tuned weights land against
                                   thousands of random ones

   Only weights are tuned, not thresholds or rule sizes. Fifteen parameters
   against a few hundred training weeks is already generous; adding the
   ~70 threshold cut points would guarantee a fitted result that means
   nothing. The objective is the return spread between Risk-On and Risk-Off
   weeks rather than hit rate, because being right on small moves and wrong
   on large ones is not worth having.
   ========================================================================= */

var OPT = null;

function optMatrix(){
  if(!BT || !BT.weeks) return null;
  var ids = CONFIG.indicators.map(function(i){ return i.id; });
  return BT.weeks.map(function(w){
    var sc = {};
    w.rows.forEach(function(r){ sc[r.id] = r.score; });
    return {date:w.date, ret:w.ret, adj:w.adj,
            s: ids.map(function(id){ return sc[id] === undefined ? null : sc[id]; })};
  });
}

function scoreWith(row, wv){
  var raw = 0, tw = 0;
  for(var i=0;i<wv.length;i++){
    if(row.s[i] === null) continue;
    raw += (row.s[i]/2) * wv[i];
    tw  += wv[i];
  }
  if(tw <= 0) return 0;
  var v = Math.round(raw*(100/tw)) + row.adj;
  return Math.max(-100, Math.min(100, v));
}

/* Metrics for one weight vector over a set of weeks. */
function evalW(rows, wv, band){
  band = band || 20;
  var on = [], off = [], hits = 0, dir = 0, rets = [];
  for(var i=0;i<rows.length;i++){
    var v = scoreWith(rows[i], wv), r = rows[i].ret;
    rets.push(r);
    if(v >= band){ on.push(r); dir++; if(r > 0) hits++; }
    else if(v <= -band){ off.push(r); dir++; if(r < 0) hits++; }
  }
  var mOn = on.length ? mean(on) : null, mOff = off.length ? mean(off) : null;
  return {
    n:rows.length, dir:dir,
    hit: dir ? hits/dir*100 : null,
    onN:on.length, offN:off.length,
    onAvg:mOn, offAvg:mOff,
    spread: (mOn !== null && mOff !== null) ? mOn - mOff : null,
    allAvg: mean(rets),
    allPos: rets.filter(function(r){ return r>0; }).length/rets.length*100
  };
}

function randW(){
  var w = CONFIG.indicators.map(function(){ return Math.random(); });
  var t = w.reduce(function(a,b){ return a+b; }, 0);
  return w.map(function(x){ return x/t*100; });
}

function objective(m){
  if(!m || m.spread === null) return -Infinity;
  /* require both sides to have enough observations to mean anything */
  if(m.onN < 15 || m.offN < 15) return -Infinity;
  return m.spread;
}

function runOptimizer(cfg){
  var rows = optMatrix();
  if(!rows) return {error:"Run the backtest first."};
  if(rows.length < 100) return {error:"Only " + rows.length + " weeks. Walk-forward needs more."};

  var split = Math.floor(rows.length * (cfg.splitPct/100));
  var train = rows.slice(0, split), test = rows.slice(split);

  /* baseline: the weights currently in the dashboard */
  var cur = CONFIG.indicators.map(function(i){ return Number(STATE.weights[i.id]||0); });

  /* random search on TRAIN only */
  var best = null, bestObj = -Infinity;
  for(var k=0;k<cfg.iters;k++){
    var w = randW();
    var o = objective(evalW(train, w, cfg.band));
    if(o > bestObj){ bestObj = o; best = w; }
  }
  /* coordinate refinement, still TRAIN only */
  if(best){
    for(var pass=0; pass<4; pass++){
      for(var i=0;i<best.length;i++){
        var tried = best.slice(), bo = objective(evalW(train, best, cfg.band));
        [0, best[i]*0.5, best[i]*1.5, best[i]+3, Math.max(0,best[i]-3)].forEach(function(cand){
          var t2 = best.slice(); t2[i] = cand;
          var sum = t2.reduce(function(a,b){return a+b;},0);
          if(sum <= 0) return;
          t2 = t2.map(function(x){ return x/sum*100; });
          var o2 = objective(evalW(train, t2, cfg.band));
          if(o2 > bo){ bo = o2; tried = t2; }
        });
        best = tried;
      }
    }
  }
  if(!best) return {error:"No weight vector produced enough signals on both sides."};

  /* permutation null: random vectors scored on the TEST set */
  var nullObjs = [];
  for(var j=0;j<cfg.perms;j++){
    var m = evalW(test, randW(), cfg.band);
    if(m.spread !== null) nullObjs.push(m.spread);
  }
  nullObjs.sort(function(a,b){ return a-b; });

  var trainM = evalW(train, best, cfg.band);
  var testM  = evalW(test,  best, cfg.band);
  var curTrain = evalW(train, cur, cfg.band);
  var curTest  = evalW(test,  cur, cfg.band);

  var pct = null;
  if(testM.spread !== null && nullObjs.length){
    var below = nullObjs.filter(function(x){ return x < testM.spread; }).length;
    pct = below/nullObjs.length*100;
  }

  return {
    split:split, trainN:train.length, testN:test.length,
    weights:best, current:cur,
    train:trainM, test:testM, curTrain:curTrain, curTest:curTest,
    nullDist:nullObjs, percentile:pct, band:cfg.band,
    benchAll: testM.allAvg, benchPos: testM.allPos
  };
}

/* =========================================================================
   LAB
   Interactive factor selection and weighting, judged on split samples.

   The split is chronological, never random: shuffling weeks would let the
   model see the future, since market conditions persist across adjacent
   weeks. Train is where you experiment freely. Validation tells you whether
   a change travels. The sealed slice stays untouched until you have settled
   on a recipe - every look at it costs some of its value, so the number of
   looks is counted and shown.
   ========================================================================= */

var SPLIT = {train:0.60, val:0.25};   /* remainder is sealed */

function labDefaults(){
  var en = {}, w = {};
  CONFIG.indicators.forEach(function(i){ en[i.id] = true; w[i.id] = i.w; });
  return {enabled:en, weights:w, recipes:[], attempts:0, looks:0, revealed:false};
}

function saveLab(){ save("mesrd.lab.v1", STATE.lab); BTC = {}; }

var BTC = {};   /* backtest cache keyed by factor/weight configuration */

function labCfg(){
  return {enabled:STATE.lab.enabled, weights:STATE.lab.weights};
}

/* accuracy, edge over always-long, and return spread for one slice */
function evalSlice(weeks){
  if(!weeks.length) return null;
  var dir = weeks.filter(function(w){ return Math.abs(w.score) >= 20; });
  var hits = dir.filter(function(w){ return (w.score>0 && w.ret>0) || (w.score<0 && w.ret<0); });
  var on  = weeks.filter(function(w){ return w.score >= 20; });
  var off = weeks.filter(function(w){ return w.score <= -20; });
  var bench = weeks.filter(function(w){ return w.ret > 0; }).length / weeks.length * 100;
  var onAvg  = on.length  ? mean(on.map(function(w){ return w.ret; }))  : null;
  var offAvg = off.length ? mean(off.map(function(w){ return w.ret; })) : null;
  return {
    n:weeks.length, dir:dir.length,
    acc: dir.length ? hits.length/dir.length*100 : null,
    bench: bench,
    spread: (onAvg !== null && offAvg !== null) ? onAvg - offAvg : null,
    onAvg:onAvg, offAvg:offAvg, onN:on.length, offN:off.length,
    corr: corr(weeks.map(function(w){ return w.score; }), weeks.map(function(w){ return w.ret; })),
    from:weeks[0].date, to:weeks[weeks.length-1].date
  };
}

function runLab(){
  var bt = runBacktest(labCfg());
  if(!bt || bt.error) return bt;
  var w = bt.weeks, n = w.length;
  var a = Math.floor(n*SPLIT.train), b = Math.floor(n*(SPLIT.train+SPLIT.val));
  return {
    all: evalSlice(w),
    train: evalSlice(w.slice(0,a)),
    val: evalSlice(w.slice(a,b)),
    sealed: evalSlice(w.slice(b)),
    weeks: w
  };
}

/* Expected best-of-N by chance: with k directional weeks, one standard error
   is 50/sqrt(k) points, and the best of N tries runs roughly 2 SE above the
   mean once N is in the dozens. Rough, but it anchors expectations. */
function chanceBar(k, tries){
  if(!k) return null;
  var se = 50/Math.sqrt(k);
  var z = tries <= 1 ? 0 : Math.min(3.2, Math.sqrt(2*Math.log(tries)));
  return 50 + z*se;
}
