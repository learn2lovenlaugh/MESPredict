<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MES Weekly Market Regime</title>
<style>
:root{
  --paper:#f7f7f5; --card:#ffffff; --ink:#1a1c1e; --ink2:#5a6067; --ink3:#8b9198;
  --rule:#dcdfe2; --rule2:#eceef0; --field:#ffffff;
  --pos:#1c7c4a; --posbg:#e6f2ea; --neg:#a8322b; --negbg:#f8e9e8;
  --warn:#8a6212; --warnbg:#faf1de; --flat:#6b7178; --flatbg:#eef0f2;
  --accent:#1f3a5f; --shadow:0 1px 2px rgba(20,24,28,.07);
}
html[data-theme="dark"]{
  --paper:#14171a; --card:#1c2024; --ink:#e8eaec; --ink2:#a3aab1; --ink3:#767d85;
  --rule:#2e343a; --rule2:#23282d; --field:#14171a;
  --pos:#5fbf8a; --posbg:#163024; --neg:#e08b83; --negbg:#341f1e;
  --warn:#d6ad5c; --warnbg:#33290f; --flat:#9aa1a8; --flatbg:#262b30;
  --accent:#9fc2e8; --shadow:none;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}
a{color:var(--accent)}
button{font:inherit;color:inherit}

/* header */
header{border-bottom:1px solid var(--rule);background:var(--card)}
.hbar{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:640;letter-spacing:-.01em;margin-right:auto}
.brand span{font-weight:400;color:var(--ink3)}
.tbtn{background:none;border:1px solid var(--rule);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tbtn:hover{border-color:var(--ink3)}
nav{border-bottom:1px solid var(--rule);background:var(--card);overflow-x:auto;-webkit-overflow-scrolling:touch}
.navin{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;white-space:nowrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 11px;cursor:pointer;color:var(--ink2);font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* sample banner */
.banner{background:var(--warnbg);border-bottom:1px solid var(--rule);color:var(--warn);font-size:13px}
.banner div{max-width:1180px;margin:0 auto;padding:8px 16px}

h2{font-size:15px;font-weight:640;margin:28px 0 10px;letter-spacing:-.005em}
h2 .sub{font-weight:400;color:var(--ink3);font-size:13px;margin-left:8px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}
.pad{padding:14px 16px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:20px}
.gauge-wrap{padding:18px 20px 16px}
.scoreline{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.score{font-size:60px;line-height:.92;font-weight:660;letter-spacing:-.03em}
.bias{font-size:19px;font-weight:620;padding-bottom:6px}
.gauge{margin:16px 0 4px;position:relative;height:34px}
.gtrack{position:absolute;top:11px;left:0;right:0;height:8px;border-radius:4px;display:flex;overflow:hidden}
.gseg{height:100%}
.gmark{position:absolute;top:4px;width:3px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-1.5px)}
.gticks{display:flex;justify-content:space-between;color:var(--ink3);font-size:11.5px;margin-top:2px}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--rule2)}
.kv div span{display:block;color:var(--ink3);font-size:11.5px;margin-bottom:2px}
.kv div b{font-size:16px;font-weight:620}

.stack{display:flex;flex-direction:column;gap:14px}
.px{padding:14px 16px}
.pxrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pxrow+.pxrow{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule2)}
.pxlab{color:var(--ink2);font-size:13px}
.pxval{font-size:19px;font-weight:620}
.summary{font-size:14px;line-height:1.62;color:var(--ink2)}
.summary b{color:var(--ink);font-weight:600}

/* contribution bars */
.contrib{padding:6px 16px 14px}
.crow{display:grid;grid-template-columns:132px 1fr 52px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--rule2)}
.crow:first-child{border-top:0}
.clab{font-size:13px;color:var(--ink2)}
.cbar{position:relative;height:16px;background:var(--rule2);border-radius:3px}
.cmid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--rule)}
.cfill{position:absolute;top:0;bottom:0;border-radius:3px}
.cval{text-align:right;font-size:13.5px;font-weight:600}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--rule2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--rule2)}
.iname{font-weight:560}
.isrc{color:var(--ink3);font-size:11.5px;margin-top:2px}
.scroll{overflow-x:auto}

.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:640;white-space:nowrap}
.p-pos{background:var(--posbg);color:var(--pos)}
.p-neg{background:var(--negbg);color:var(--neg)}
.p-flat{background:var(--flatbg);color:var(--flat)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.tpos{color:var(--pos)} .tneg{color:var(--neg)} .tflat{color:var(--ink2)} .twarn{color:var(--warn)}
.stale{color:var(--warn)}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.42);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;z-index:50;background:var(--card);border:1px solid var(--rule);display:none;overflow-y:auto}
.drawer.on{display:block}
@media (min-width:721px){.drawer{top:0;right:0;bottom:0;width:420px;border-radius:0}}
@media (max-width:720px){.drawer{left:0;right:0;bottom:0;max-height:88vh;border-radius:12px 12px 0 0}}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--card)}
.dhead h3{margin:0;font-size:16px;font-weight:640}
.x{background:none;border:1px solid var(--rule);border-radius:5px;width:28px;height:28px;cursor:pointer;color:var(--ink2);line-height:1}
.dbody{padding:16px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:13.5px}
.drow span{color:var(--ink2)}
.why{margin-top:14px;padding:12px 13px;background:var(--rule2);border-radius:6px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.thr{margin-top:14px;font-size:12.5px;color:var(--ink2)}
.thr table{width:100%;border-collapse:collapse;margin-top:6px}
.thr td{padding:4px 6px;border-bottom:1px solid var(--rule2)}
.thr tr.hit{background:var(--rule2);font-weight:640;color:var(--ink)}

/* forms */
label.f{display:block;margin-top:12px;font-size:12.5px;color:var(--ink2)}
input[type=text],input[type=number],textarea,select{
  width:100%;margin-top:4px;padding:8px 9px;border:1px solid var(--rule);border-radius:5px;
  background:var(--field);color:var(--ink);font:inherit;font-size:14px}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 13px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .btn.primary{color:#14171a}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.empty{padding:26px 18px;text-align:center;color:var(--ink2);font-size:13.5px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:620;margin-bottom:4px;font-size:14.5px}
.note{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.55}
.wgrid{display:grid;grid-template-columns:1fr 92px;gap:8px 12px;align-items:center;font-size:13.5px}
.wgrid input{margin-top:0;text-align:right}
.wsum{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-weight:620;font-size:13.5px}
.databar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;margin-top:18px;
  background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);font-size:13px}
.databar .grow{margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.d-live{background:var(--pos)} .d-mix{background:var(--warn)} .d-sample{background:var(--ink3)}
.log{margin-top:12px;font-size:12.5px}
.log table{width:100%;border-collapse:collapse}
.log td{padding:5px 8px;border-bottom:1px solid var(--rule2)}
.log td:last-child{text-align:right}
.spin{opacity:.6}
footer{border-top:1px solid var(--rule);margin-top:44px;padding:18px 0 0;color:var(--ink3);font-size:12px;line-height:1.6}
.hide{display:none}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .score{font-size:50px}
  .crow{grid-template-columns:104px 1fr 46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand">MES Weekly Market Regime <span>/ phase 1</span></div>
    <button class="tbtn" id="themeBtn" type="button">Dark theme</button>
  </div>
</header>

<div class="banner"><div id="bannerTxt">Sample data. Every value below is placeholder input for laying out the interface, not market data. Use Edit value to enter real numbers.</div></div>

<nav><div class="navin" id="tabs" role="tablist"></div></nav>

<div class="wrap" id="view"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail"></aside>

<script>
"use strict";

/* =========================================================================
   CONFIG - single source of truth for categories, indicators, thresholds.
   Nothing in the UI hard-codes a scoring decision; all of it reads from here.
   ========================================================================= */

var CONFIG = {
  bands: [
    {min:  60, max: 101, label:"Strongly Risk-On",    tone:"pos"},
    {min:  20, max:  60, label:"Moderately Risk-On",  tone:"pos"},
    {min: -19, max:  20, label:"Neutral / Mixed",     tone:"flat"},
    {min: -60, max: -19, label:"Moderately Risk-Off", tone:"neg"},
    {min:-101, max: -60, label:"Strongly Risk-Off",   tone:"neg"}
  ],
  categories: [
    {id:"vol",    name:"Volatility"},
    {id:"rates",  name:"Rates / Fed"},
    {id:"macro",  name:"Macro"},
    {id:"credit", name:"Credit / Liquidity"},
    {id:"intern", name:"Market Internals"},
    {id:"other",  name:"Commodities"}
  ],
  /* thresholds: ordered cut points. score applies when driver < max.
     Final entry uses max:null meaning "everything above". */
  indicators: [
    {id:"vix", cat:"vol", w:12, name:"VIX", driver:"chg5d", unit:"", drvUnit:"%",
     drvLabel:"5-day change", src:"Cboe / manual",
     thresholds:[{max:-10,s:2},{max:-3,s:1},{max:3,s:0},{max:10,s:-1},{max:null,s:-2}],
     desc:"Implied 30-day volatility on the S&P 500. Direction matters more than level: a falling VIX usually accompanies rising equities, while a fast spike marks repricing of risk.",
     fields:[["Level","level",""],["Weekly change","chgw","%"]]},

    {id:"vterm", cat:"vol", w:8, name:"VIX term structure", driver:"ratio", unit:"", drvUnit:"x",
     drvLabel:"VIX / VIX3M", src:"Cboe / manual",
     thresholds:[{max:0.85,s:2},{max:0.95,s:1},{max:1.00,s:0},{max:1.05,s:-1},{max:null,s:-2}],
     desc:"VIX divided by VIX3M. Below 1.0 is contango, the normal state. Above 1.0 is backwardation: near-term risk is priced above longer-dated risk, which historically marks stressed conditions.",
     fields:[["VIX","vix",""],["VIX3M","vix3m",""],["State","state",""]]},

    {id:"ust2y", cat:"rates", w:7, name:"2-Year Treasury", driver:"chgbp", unit:"%", drvUnit:" bps",
     drvLabel:"Weekly change", src:"FRED DGS2 / manual",
     thresholds:[{max:-15,s:2},{max:-5,s:1},{max:5,s:0},{max:15,s:-1},{max:null,s:-2}],
     desc:"The 2-year tracks expected policy over the next two years. A sharp fall usually means the market is pulling forward rate cuts, which supports valuations unless it is driven by recession fear.",
     fields:[["Yield","level","%"],["Prior week","prev","%"]]},

    {id:"ust10y", cat:"rates", w:5, name:"10-Year Treasury", driver:"chgbp", unit:"%", drvUnit:" bps",
     drvLabel:"Weekly change", src:"FRED DGS10 / manual",
     thresholds:[{max:-15,s:2},{max:-5,s:1},{max:5,s:0},{max:15,s:-1},{max:null,s:-2}],
     desc:"The long-end discount rate. Rising 10-year yields compress equity multiples; the effect is strongest when the move is fast rather than large.",
     fields:[["Yield","level","%"],["Prior week","prev","%"],["10Y minus 2Y","curve"," bps"]]},

    {id:"real10y", cat:"rates", w:7, name:"10-Year real yield", driver:"chgbp", unit:"%", drvUnit:" bps",
     drvLabel:"Weekly change", src:"FRED DFII10 / manual",
     thresholds:[{max:-12,s:2},{max:-4,s:1},{max:4,s:0},{max:12,s:-1},{max:null,s:-2}],
     desc:"Nominal yield less inflation compensation. This is the cleanest single read on the discount rate applied to future earnings, which is why it carries more weight than the nominal 10-year.",
     fields:[["Real yield","level","%"],["Prior week","prev","%"]]},

    {id:"fedexp", cat:"rates", w:6, name:"Fed expectations", driver:"cutprob", unit:"", drvUnit:"%",
     drvLabel:"Cut probability, next meeting", src:"Fed funds futures / manual",
     thresholds:[{max:10,s:-1},{max:35,s:0},{max:65,s:1},{max:null,s:2}],
     desc:"Market-implied odds of an easing at the next FOMC. Supportive on its own, but read it against labor and credit: rising cut odds driven by deteriorating growth is not a bullish signal.",
     fields:[["Fed funds target","target","%"],["Hold","holdprob","%"],["Hike","hikeprob","%"]]},

    {id:"infl", cat:"macro", w:6, name:"Inflation", driver:"surprise", unit:"", drvUnit:" pp",
     drvLabel:"CPI surprise vs consensus", src:"BLS / manual",
     thresholds:[{max:-0.2,s:2},{max:-0.05,s:1},{max:0.05,s:0},{max:0.2,s:-1},{max:null,s:-2}],
     desc:"Actual CPI less consensus. Softer-than-expected inflation eases policy pressure, but only reads as supportive when growth and labor are holding up.",
     fields:[["Headline CPI YoY","cpi","%"],["Core CPI YoY","core","%"],["Consensus","cons","%"],["Core PCE YoY","pce","%"]]},

    {id:"labor", cat:"macro", w:5, name:"Employment", driver:"claims4w", unit:"", drvUnit:"k",
     drvLabel:"4-week average claims", src:"DOL / BLS / manual",
     thresholds:[{max:210,s:1},{max:240,s:0},{max:275,s:-1},{max:null,s:-2}],
     desc:"Initial claims are the highest-frequency labor read. Deterioration is bearish even though it raises easing odds, because earnings follow employment.",
     fields:[["Initial claims","claims","k"],["Nonfarm payrolls","nfp","k"],["Payroll consensus","nfpcons","k"],["Unemployment rate","urate","%"],["Avg hourly earnings YoY","ahe","%"]]},

    {id:"growth", cat:"macro", w:4, name:"Growth", driver:"ismavg", unit:"", drvUnit:"",
     drvLabel:"ISM composite", src:"ISM / Atlanta Fed / manual",
     thresholds:[{max:47,s:-2},{max:50,s:-1},{max:53,s:0},{max:56,s:1},{max:null,s:2}],
     desc:"Average of the manufacturing and services ISM. Fifty is the expansion line. Below it, weak growth turns falling yields from a tailwind into a warning.",
     fields:[["ISM manufacturing","ismm",""],["ISM services","isms",""],["New orders","orders",""],["GDPNow","gdpnow","%"]]},

    {id:"hyoas", cat:"credit", w:8, name:"High-yield spread", driver:"chgbp", unit:" bps", drvUnit:" bps",
     drvLabel:"Weekly change", src:"FRED BAMLH0A0HYM2 / manual",
     thresholds:[{max:-20,s:2},{max:-6,s:1},{max:6,s:0},{max:20,s:-1},{max:null,s:-2}],
     desc:"Option-adjusted spread on high-yield credit. Credit usually breaks before equities do, so widening spreads alongside a rising index is a divergence worth respecting.",
     fields:[["HY OAS","level"," bps"],["Prior week","prev"," bps"],["IG spread","ig"," bps"],["IG weekly change","igchg"," bps"]]},

    {id:"fci", cat:"credit", w:7, name:"Financial conditions", driver:"chg", unit:"", drvUnit:"",
     drvLabel:"Weekly change in NFCI", src:"Chicago Fed NFCI / manual",
     thresholds:[{max:-0.03,s:2},{max:-0.01,s:1},{max:0.01,s:0},{max:0.03,s:-1},{max:null,s:-2}],
     desc:"Chicago Fed National Financial Conditions Index. Negative readings are looser than average. Easing conditions widen the funding channel that supports risk assets.",
     fields:[["NFCI level","level",""],["Prior week","prev",""]]},

    {id:"trend", cat:"intern", w:7, name:"S&P 500 trend", driver:"maScore", unit:"", drvUnit:" of 3",
     drvLabel:"Moving averages held", src:"Index data / manual",
     thresholds:[{max:1,s:-2},{max:2,s:-1},{max:3,s:1},{max:null,s:2}],
     desc:"Count of the 20-, 50- and 200-day averages the index is trading above. A blunt but durable trend filter.",
     fields:[["Above 20DMA","ma20",""],["Above 50DMA","ma50",""],["Above 200DMA","ma200",""]]},

    {id:"breadth", cat:"intern", w:7, name:"Breadth", driver:"pct50", unit:"", drvUnit:"%",
     drvLabel:"Percent above 50DMA", src:"Index data / manual",
     thresholds:[{max:30,s:-2},{max:45,s:-1},{max:60,s:0},{max:75,s:1},{max:null,s:2}],
     desc:"Share of S&P 500 members above their 50-day average. Narrow breadth under a rising index means the advance rests on a handful of names.",
     fields:[["Percent above 50DMA","pct50","%"],["Advance/decline trend","adline",""],["New highs minus lows","nhnl",""]]},

    {id:"putcall", cat:"intern", w:3, name:"Put/call ratio", driver:"level", unit:"", drvUnit:"",
     drvLabel:"Equity put/call", src:"Cboe / manual",
     thresholds:[{max:0.75,s:-1},{max:0.95,s:0},{max:1.10,s:1},{max:null,s:2}],
     desc:"Contrarian positioning read. Very low readings mean complacency; elevated readings often mark washed-out sentiment near lows.",
     fields:[["5-day average","avg5",""]]},

    {id:"dxy", cat:"intern", w:3, name:"Dollar index", driver:"chgpct", unit:"", drvUnit:"%",
     drvLabel:"Weekly change", src:"FX data / manual",
     thresholds:[{max:-1.0,s:2},{max:-0.3,s:1},{max:0.3,s:0},{max:1.0,s:-1},{max:null,s:-2}],
     desc:"A rising dollar tightens global funding and trims overseas earnings translation for S&P 500 constituents.",
     fields:[["DXY","level",""],["Prior week","prev",""]]},

    {id:"oil", cat:"other", w:5, name:"Crude oil", driver:"chgpct", unit:"", drvUnit:"%",
     drvLabel:"Weekly change", src:"EIA / manual",
     thresholds:[{max:-8,s:-1},{max:-3,s:1},{max:3,s:0},{max:8,s:-1},{max:null,s:-2}],
     desc:"Read as an inflation-pressure gauge rather than a growth proxy. Both a sharp spike and a collapse score negatively: the first is a cost shock, the second usually signals demand loss.",
     fields:[["WTI","level","$"],["Prior week","prev","$"],["Copper","copper","$"],["Gold","gold","$"]]}
  ],
  eventRisk: {highEventsForHigh:1, mediumEventsForMedium:2, confidencePenalty:{HIGH:14, MEDIUM:6, LOW:0}}
};

/* =========================================================================
   FRED - series pulled, and how they map onto indicator fields.
   Everything here is free-tier FRED with one API key. Four indicators have
   no FRED equivalent and stay on manual entry; they are listed in NO_FRED.
   ========================================================================= */

var FRED = {
  base: "https://api.stlouisfed.org/fred/series/observations",
  series: {
    VIXCLS:{n:40}, VXVCLS:{n:40},
    DGS2:{n:40}, DGS10:{n:40}, DFII10:{n:40},
    DFEDTARU:{n:5},
    CPIAUCSL:{n:15}, CPILFESL:{n:15},
    ICSA:{n:10}, PAYEMS:{n:4}, UNRATE:{n:3}, CES0500000003:{n:15},
    GDPNOW:{n:3},
    BAMLH0A0HYM2:{n:40}, BAMLC0A0CM:{n:40},
    NFCI:{n:6},
    SP500:{n:300},
    DTWEXBGS:{n:40}, DCOILWTICO:{n:40}
  }
};

var NO_FRED = {
  fedexp:  "Cut probability is implied by fed funds futures, which FRED does not carry.",
  growth:  "ISM licenses its indices; they are not in any free feed.",
  breadth: "Percent above 50DMA needs constituent data, not an index series.",
  putcall: "Cboe publishes this daily but not through FRED."
};

/* last N clean numeric observations, newest first */
function obs(S, id){
  var a = S[id];
  if(!a || !a.length) return [];
  return a.filter(function(o){ return o.value !== "." && o.value !== "" && !isNaN(Number(o.value)); })
          .map(function(o){ return {d:o.date, v:Number(o.value)}; })
          .sort(function(x,y){ return x.d < y.d ? 1 : -1; });
}
function last(S, id){ var a = obs(S,id); return a.length ? a[0].v : null; }
function back(S, id, k){ var a = obs(S,id); return a.length > k ? a[k].v : null; }
function dateOf(S, id){ var a = obs(S,id); return a.length ? a[0].d + "T16:00:00" : null; }
function delta(S, id, k){
  var a = last(S,id), b = back(S,id,k);
  return (a===null||b===null) ? null : a-b;
}
function pctChg(S, id, k){
  var a = last(S,id), b = back(S,id,k);
  return (a===null||b===null||b===0) ? null : Math.round((a-b)/b*1000)/10;
}
function yoy(S, id){
  var a = obs(S,id);
  if(a.length < 13) return null;
  return Math.round((a[0].v - a[12].v)/a[12].v * 1000)/10;
}
function ma(S, id, n){
  var a = obs(S,id);
  if(a.length < n) return null;
  var s = 0; for(var i=0;i<n;i++) s += a[i].v;
  return s/n;
}
function r2(x){ return x===null||x===undefined ? null : Math.round(x*100)/100; }

/* Map raw FRED series onto the indicator value shapes the engine expects. */
function derive(S){
  var out = {}, spx = last(S,"SP500");

  if(last(S,"VIXCLS") !== null)
    out.vix = {level:last(S,"VIXCLS"), chg5d:pctChg(S,"VIXCLS",5), chgw:pctChg(S,"VIXCLS",5), updated:dateOf(S,"VIXCLS")};

  if(last(S,"VIXCLS") !== null && last(S,"VXVCLS") !== null){
    var rr = r2(last(S,"VIXCLS")/last(S,"VXVCLS"));
    out.vterm = {ratio:rr, vix:last(S,"VIXCLS"), vix3m:last(S,"VXVCLS"),
                 state: rr < 1 ? "Contango" : "Backwardation", updated:dateOf(S,"VXVCLS")};
  }
  if(last(S,"DGS2") !== null)
    out.ust2y = {level:last(S,"DGS2"), prev:back(S,"DGS2",5),
                 chgbp:Math.round(delta(S,"DGS2",5)*100), updated:dateOf(S,"DGS2")};

  if(last(S,"DGS10") !== null){
    var curve = (last(S,"DGS10")!==null && last(S,"DGS2")!==null)
      ? Math.round((last(S,"DGS10")-last(S,"DGS2"))*100) : null;
    out.ust10y = {level:last(S,"DGS10"), prev:back(S,"DGS10",5),
                  chgbp:Math.round(delta(S,"DGS10",5)*100), curve:curve, updated:dateOf(S,"DGS10")};
  }
  if(last(S,"DFII10") !== null)
    out.real10y = {level:last(S,"DFII10"), prev:back(S,"DFII10",5),
                   chgbp:Math.round(delta(S,"DFII10",5)*100), updated:dateOf(S,"DFII10")};

  /* driver (cut probability) stays manual; only the target rate is fetched */
  if(last(S,"DFEDTARU") !== null)
    out.fedexp = {target:last(S,"DFEDTARU"), updated:dateOf(S,"DFEDTARU")};

  var cpi = yoy(S,"CPIAUCSL"), core = yoy(S,"CPILFESL");
  if(cpi !== null) out.infl = {cpi:cpi, core:core, updated:dateOf(S,"CPIAUCSL")};

  if(last(S,"ICSA") !== null){
    var c = obs(S,"ICSA"), avg4 = null;
    if(c.length >= 4) avg4 = Math.round((c[0].v+c[1].v+c[2].v+c[3].v)/4/1000);
    var p = obs(S,"PAYEMS");
    out.labor = {claims:Math.round(c[0].v/1000), claims4w:avg4,
                 nfp: p.length>1 ? Math.round(p[0].v - p[1].v) : null,
                 urate:last(S,"UNRATE"), ahe:yoy(S,"CES0500000003"),
                 updated:dateOf(S,"ICSA")};
  }
  /* ISM is the driver and is not available; GDPNow is fetched as context only */
  if(last(S,"GDPNOW") !== null) out.growth = {gdpnow:last(S,"GDPNOW"), updated:dateOf(S,"GDPNOW")};

  if(last(S,"BAMLH0A0HYM2") !== null)
    out.hyoas = {level:Math.round(last(S,"BAMLH0A0HYM2")*100), prev:Math.round(back(S,"BAMLH0A0HYM2",5)*100),
                 chgbp:Math.round(delta(S,"BAMLH0A0HYM2",5)*100),
                 ig: last(S,"BAMLC0A0CM")===null?null:Math.round(last(S,"BAMLC0A0CM")*100),
                 igchg: delta(S,"BAMLC0A0CM",5)===null?null:Math.round(delta(S,"BAMLC0A0CM",5)*100),
                 updated:dateOf(S,"BAMLH0A0HYM2")};

  if(last(S,"NFCI") !== null)
    out.fci = {level:last(S,"NFCI"), prev:back(S,"NFCI",1), chg:r2(delta(S,"NFCI",1)), updated:dateOf(S,"NFCI")};

  if(spx !== null){
    var m20 = ma(S,"SP500",20), m50 = ma(S,"SP500",50), m200 = ma(S,"SP500",200);
    var n = 0;
    if(m20 !== null && spx > m20) n++;
    if(m50 !== null && spx > m50) n++;
    if(m200 !== null && spx > m200) n++;
    out.trend = {maScore: (m200===null?null:n),
                 ma20: m20===null?null:(spx>m20?"Yes":"No"),
                 ma50: m50===null?null:(spx>m50?"Yes":"No"),
                 ma200: m200===null?null:(spx>m200?"Yes":"No"),
                 updated:dateOf(S,"SP500")};
  }
  if(last(S,"DTWEXBGS") !== null)
    out.dxy = {level:r2(last(S,"DTWEXBGS")), prev:r2(back(S,"DTWEXBGS",5)),
               chgpct:pctChg(S,"DTWEXBGS",5), updated:dateOf(S,"DTWEXBGS")};

  if(last(S,"DCOILWTICO") !== null)
    out.oil = {level:last(S,"DCOILWTICO"), prev:back(S,"DCOILWTICO",5),
               chgpct:pctChg(S,"DCOILWTICO",5), updated:dateOf(S,"DCOILWTICO")};

  var index = null;
  if(spx !== null){
    index = {spx:spx, prev:back(S,"SP500",5), chg:pctChg(S,"SP500",5), asOf:dateOf(S,"SP500")};
  }
  return {values:out, index:index};
}

/* =========================================================================
   STATE + STORAGE
   ========================================================================= */

var LS = {settings:"mesrd.settings.v1", manual:"mesrd.manual.v1", snaps:"mesrd.snapshots.v1",
          live:"mesrd.live.v1", key:"mesrd.fredkey.v1"};

function load(k, fb){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }catch(e){ return fb; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

var STATE = {
  tab: "overview",
  weights: load(LS.settings, null) || defaultWeights(),
  manual: load(LS.manual, {}),
  snaps: load(LS.snaps, []),
  live: load(LS.live, null),          /* {fetched, values, index, log} */
  key: load(LS.key, ""),
  fetching: false
};

function defaultWeights(){
  var w = {};
  CONFIG.indicators.forEach(function(i){ w[i.id] = i.w; });
  return w;
}

/* Resolution order: manual entry > fetched FRED value > sample.
   Sample values are only used for fields no real source has supplied. */
function valueOf(id){
  var merged = {}, src = "sample";
  var samp = MOCK.values[id] || {};
  Object.keys(samp).forEach(function(k){ merged[k] = samp[k]; });

  var liveVals = STATE.live && STATE.live.values ? STATE.live.values[id] : null;
  if(liveVals){
    Object.keys(liveVals).forEach(function(k){
      if(liveVals[k] !== null && liveVals[k] !== undefined) { merged[k] = liveVals[k]; src = "live"; }
    });
  }
  var man = STATE.manual[id];
  if(man){
    Object.keys(man).forEach(function(k){
      if(man[k] !== "" && man[k] !== null && man[k] !== undefined) { merged[k] = man[k]; src = "manual"; }
    });
  }
  return {v:merged, manual:src === "manual", src:src};
}

/* Index level and weekly change: fetched if present, otherwise the sample. */
function priceInfo(){
  if(STATE.live && STATE.live.index && STATE.live.index.spx !== null){
    return {price:STATE.live.index.spx, weekChg:STATE.live.index.chg,
            asOf:STATE.live.index.asOf, label:"S&P 500 index", live:true};
  }
  return {price:MOCK.mes.price, weekChg:MOCK.mes.weekChg, asOf:MOCK.mes.asOf, label:"MES (sample)", live:false};
}

/* How much of the model is running on real data right now. */
function coverageState(){
  var live = 0, man = 0, samp = 0;
  CONFIG.indicators.forEach(function(i){
    var s = valueOf(i.id).src;
    if(s === "live") live++; else if(s === "manual") man++; else samp++;
  });
  return {live:live, manual:man, sample:samp, total:CONFIG.indicators.length};
}

/* =========================================================================
   SCORING ENGINE (Phase 1 stub)
   Threshold lookup only. The cross-indicator rules engine described in the
   spec is Phase 2 and is deliberately not implemented here.
   ========================================================================= */

function scoreOf(ind, driverVal){
  if(driverVal === null || driverVal === undefined || driverVal === "" || isNaN(Number(driverVal))) return null;
  var x = Number(driverVal);
  for(var i=0;i<ind.thresholds.length;i++){
    var t = ind.thresholds[i];
    if(t.max === null || x < t.max) return t.s;
  }
  return 0;
}

function compute(){
  var rows = [], totalW = 0;
  CONFIG.indicators.forEach(function(ind){
    var got = valueOf(ind.id);
    var drv = got.v[ind.driver];
    var s = scoreOf(ind, drv);
    var w = Number(STATE.weights[ind.id] || 0);
    rows.push({ind:ind, val:got.v, manual:got.manual, src:got.src, driver:drv, score:s, weight:w,
                contrib: s === null ? 0 : (s/2) * w});
    if(s !== null) totalW += w;
  });
  var raw = rows.reduce(function(a,r){ return a + r.contrib; }, 0);
  /* renormalize onto -100..+100 using only the weight actually available */
  var total = totalW > 0 ? Math.round(raw * (100/totalW)) : 0;
  total = Math.max(-100, Math.min(100, total));

  var cats = CONFIG.categories.map(function(c){
    var sub = rows.filter(function(r){ return r.ind.cat === c.id; });
    var cw = sub.reduce(function(a,r){ return a + (r.score===null?0:r.weight); }, 0);
    var craw = sub.reduce(function(a,r){ return a + r.contrib; }, 0);
    return {id:c.id, name:c.name, weight:cw,
            points: totalW>0 ? Math.round(craw*(100/totalW)) : 0,
            rows:sub};
  });

  return {rows:rows, total:total, cats:cats, availW:totalW,
          band:bandFor(total), event:eventRisk(), confidence:confidence(rows, totalW)};
}

function bandFor(x){
  for(var i=0;i<CONFIG.bands.length;i++){
    var b = CONFIG.bands[i];
    if(x >= b.min && x < b.max) return b;
  }
  return CONFIG.bands[2];
}

function eventRisk(){
  var soon = upcoming(7);
  var high = soon.filter(function(e){ return e.imp === "High"; }).length;
  var med  = soon.filter(function(e){ return e.imp === "Medium"; }).length;
  if(high >= CONFIG.eventRisk.highEventsForHigh) return "HIGH";
  if(med  >= CONFIG.eventRisk.mediumEventsForMedium) return "MEDIUM";
  return "LOW";
}

function upcoming(days){
  var now = nowRef();
  var end = new Date(now.getTime() + days*864e5);
  return MOCK.calendar.filter(function(e){
    var d = new Date(e.date + "T12:00:00");
    return d >= now && d <= end;
  });
}

/* Phase 1 confidence: agreement + coverage, less an event-risk penalty. */
function confidence(rows, availW){
  var scored = rows.filter(function(r){ return r.score !== null; });
  if(!scored.length) return 0;
  var totalW = CONFIG.indicators.reduce(function(a,i){ return a + Number(STATE.weights[i.id]||0); }, 0);
  var coverage = totalW > 0 ? availW/totalW : 0;

  var net = scored.reduce(function(a,r){ return a + r.contrib; }, 0);
  var dir = net >= 0 ? 1 : -1;
  var agreeW = 0, sumW = 0;
  scored.forEach(function(r){
    sumW += r.weight;
    if(r.score === 0) agreeW += r.weight*0.5;
    else if((r.score>0?1:-1) === dir) agreeW += r.weight;
  });
  var agreement = sumW > 0 ? agreeW/sumW : 0.5;

  var c = 100 * (0.62*agreement + 0.38*coverage);
  c -= CONFIG.eventRisk.confidencePenalty[eventRisk()] || 0;
  return Math.max(0, Math.min(100, Math.round(c)));
}

/* =========================================================================
   SUMMARY TEXT - deterministic, no generative call
   ========================================================================= */

function summaryText(M){
  var scored = M.rows.filter(function(r){ return r.score !== null; });
  var byC = scored.slice().sort(function(a,b){ return b.contrib - a.contrib; });
  var up = byC.filter(function(r){ return r.contrib > 0; }).slice(0,3);
  var dn = byC.filter(function(r){ return r.contrib < 0; }).slice(-3).reverse();

  var tone = M.total >= 20 ? "supportive" : M.total <= -20 ? "unsupportive" : "mixed";
  var out = "Conditions read as <b>" + esc(M.band.label.toLowerCase()) + "</b>, with a score of " +
            sgn(M.total) + " out of 100. The overall balance of indicators is " + tone + " for equities. ";
  if(up.length) out += "Supporting the score: " + list(up.map(function(r){ return r.ind.name.toLowerCase(); })) + ". ";
  if(dn.length) out += "Weighing against it: " + list(dn.map(function(r){ return r.ind.name.toLowerCase(); })) + ". ";
  var miss = M.rows.length - scored.length;
  if(miss > 0) out += miss + " indicator" + (miss>1?"s have":" has") + " no value entered, which lowers confidence. ";
  var hi = upcoming(7).filter(function(e){ return e.imp==="High"; });
  if(hi.length) out += "Event risk is " + M.event.toLowerCase() + ": " + list(hi.slice(0,3).map(function(e){ return e.name; })) + " land inside the coming week.";
  else out += "No high-impact releases fall inside the coming week.";
  return out;
}

function list(a){
  if(a.length === 1) return esc(a[0]);
  if(a.length === 2) return esc(a[0]) + " and " + esc(a[1]);
  return a.slice(0,-1).map(esc).join(", ") + " and " + esc(a[a.length-1]);
}

/* =========================================================================
   HELPERS
   ========================================================================= */

function esc(s){ return String(s===null||s===undefined?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function sgn(n){ if(n===null||n===undefined||n==="") return "--"; var v=Number(n); return (v>0?"+":"") + v; }
function sgnf(n,d){ if(n===null||n===undefined||n==="") return "--"; var v=Number(n); return (v>0?"+":"") + v.toFixed(d===undefined?2:d); }
function tone(s){ return s===null?"flat":s>0?"pos":s<0?"neg":"flat"; }
function toneCls(s){ return "t" + tone(s); }
function pillCls(s){ return "pill p-" + tone(s); }

/* Reference "now": the real clock once anything has been fetched, otherwise
   the sample timestamp, so sample data does not read as years stale. */
function nowRef(){
  return (STATE.live && STATE.live.fetched) ? new Date() : new Date(MOCK.mes.asOf);
}

function ago(iso){
  if(!iso) return {txt:"no timestamp", stale:true};
  var t = new Date(iso), now = nowRef();
  var m = Math.round((now - t)/60000);
  if(isNaN(m)) return {txt:String(iso), stale:false};
  if(m < 60) return {txt:m + " min ago", stale:false};
  var h = Math.round(m/60);
  if(h < 36) return {txt:h + " hr ago", stale:false};
  var d = Math.round(h/24);
  return {txt:d + " days ago", stale:d > 8};
}

function fmt(v, unit){
  if(v === null || v === undefined || v === "") return "--";
  if(isNaN(Number(v))) return esc(v);
  var n = Number(v);
  var s = (Math.abs(n) >= 1000) ? n.toLocaleString("en-US") :
          (Math.abs(n) >= 100 ? n.toFixed(Math.abs(n%1)>0?1:0) : n.toFixed(2).replace(/\.00$/,""));
  if(unit === "$") return "$" + s;
  return s + (unit || "");
}
function drv(r){
  if(r.driver === null || r.driver === undefined || r.driver === "") return "--";
  if(isNaN(Number(r.driver))) return esc(r.driver);
  var u = r.ind.drvUnit || "";
  var signed = /change|surprise|probability/i.test(r.ind.drvLabel) && !/of 3|composite|percent above/i.test(r.ind.drvLabel);
  var n = Number(r.driver);
  var body = signed ? (n>0?"+":"") + n : String(n);
  return body + u;
}

    return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(STATE.tab===t[0])+'">'+esc(t[1])+'</button>';
  }).join("");
}

function renderBanner(){
  var c = coverageState();
  var b = document.querySelector(".banner"), t = document.getElementById("bannerTxt");
  if(!b || !t) return;
  if(c.sample === 0){ b.classList.add("hide"); return; }
  b.classList.remove("hide");
  if(c.live === 0){
    t.textContent = "Sample data. Every value below is placeholder input for laying out the interface, not market data. " +
      "Add a FRED key in Settings and press Get live data.";
  } else {
    t.textContent = c.sample + " of " + c.total + " indicators are still on sample values and are marked Sample. " +
      "They are being scored as if real. Enter them by hand or drop their weight to zero.";
  }
}

function render(){
  renderTabs();
  renderBanner();
  var M = compute();
  var v = document.getElementById("view");
  var t = STATE.tab;
  if(t === "overview") v.innerHTML = viewOverview(M);
  else if(t === "calendar") v.innerHTML = viewCalendar(M);
  else if(t === "history") v.innerHTML = viewHistory(M);
  else if(t === "analytics") v.innerHTML = viewAnalytics(M);
  else if(t === "settings") v.innerHTML = viewSettings(M);
  else v.innerHTML = viewCategory(M, t);
  v.innerHTML += footerHTML();
  window.scrollTo(0,0);
}

function viewHistory(M){
  if(!STATE.snaps.length){
    return '<h2>Saved weeks</h2><section class="card"><div class="empty">' +
      '<b>No weeks saved yet</b>Save a week from the Overview tab to freeze the current score and every input behind it. ' +
      'The next week\'s MES close gets filled in afterward, which is how the model gets scored.</div></section>';
  }
  var rows = STATE.snaps.slice().sort(function(a,b){ return b.date < a.date ? -1 : 1; }).map(function(s){
    var ret = (s.mesEnd !== null && s.mesEnd !== undefined && s.mesEnd !== "")
      ? ((Number(s.mesEnd) - Number(s.mesStart))/Number(s.mesStart)*100) : null;
    var result = "--";
    if(ret !== null){
      if(Math.abs(s.score) < 20) result = "Neutral";
      else if((s.score > 0 && ret > 0) || (s.score < 0 && ret < 0)) result = "Correct";
      else result = "Wrong";
    }
    var rcls = result === "Correct" ? "p-pos" : result === "Wrong" ? "p-neg" : "p-flat";
    return '<tr><td class="num">'+esc(s.date)+'</td>' +
      '<td class="r num '+toneCls(s.score)+'">'+sgn(s.score)+'</td>' +
      '<td>'+esc(s.bias)+'</td>' +
      '<td class="r num">'+fmt(s.mesStart,"")+'</td>' +
      '<td class="r"><input type="number" step="0.25" data-endfor="'+esc(s.id)+'" value="'+esc(s.mesEnd===null?"":s.mesEnd)+'" style="width:96px;margin:0" placeholder="close"></td>' +
      '<td class="r num '+(ret===null?"":toneCls(ret))+'">'+(ret===null?"--":sgnf(ret,2)+"%")+'</td>' +
      '<td class="r"><span class="pill '+rcls+'">'+result+'</span></td>' +
      '<td class="r"><button class="btn" data-del="'+esc(s.id)+'" style="padding:4px 9px">Remove</button></td></tr>';
  }).join("");

  return '<h2>Saved weeks<span class="sub">'+STATE.snaps.length+' recorded</span></h2>' +
    '<section class="card scroll"><table class="tbl"><thead><tr><th>Week of</th><th class="r">Score</th><th>Bias</th>' +
    '<th class="r">MES start</th><th class="r">MES end</th><th class="r">Return</th><th class="r">Result</th><th></th>' +
    '</tr></thead><tbody>'+rows+'</tbody></table></section>' +
    '<div class="note">Enter the following Friday close in the MES end column. Everything else is frozen and will not change.</div>' +
    '<div class="btns"><button class="btn" data-act="exportjson">Export JSON</button>' +
    '<button class="btn" data-act="exportcsv">Export CSV</button>' +
    '<button class="btn" data-act="import">Import JSON</button>' +
    '<button class="btn danger" data-act="clear">Clear saved weeks</button></div>';
}

function viewAnalytics(M){
  var done = STATE.snaps.filter(function(s){ return s.mesEnd; });
  if(done.length < 8){
    return '<h2>Model performance</h2><section class="card"><div class="empty">' +
      '<b>'+done.length+' of 8 completed weeks</b>Accuracy, bucket returns and indicator effectiveness need a meaningful sample ' +
      'before they say anything. Nothing is shown until at least eight weeks have both a score and a following close.' +
      '<div class="note" style="margin-top:14px">Accumulating forward puts this around mid-2027. Seeding history from past data ' +
      'would answer the question far sooner and is worth doing before trusting any of these weights.</div></div></section>';
  }
  var rets = done.map(function(s){ return (Number(s.mesEnd)-Number(s.mesStart))/Number(s.mesStart)*100; });
  var hit = done.filter(function(s,i){
    if(Math.abs(s.score) < 20) return false;
    return (s.score>0 && rets[i]>0) || (s.score<0 && rets[i]<0);
  }).length;
  var directional = done.filter(function(s){ return Math.abs(s.score) >= 20; }).length;
  var avg = rets.reduce(function(a,b){return a+b;},0)/rets.length;
  return '<h2>Model performance<span class="sub">'+done.length+' completed weeks</span></h2>' +
    '<section class="card pad"><div class="kv" style="margin:0;padding:0;border:0">' +
      '<div><span>Observations</span><b>'+done.length+'</b></div>' +
      '<div><span>Directional calls</span><b>'+directional+'</b></div>' +
      '<div><span>Hit rate</span><b>'+(directional?Math.round(hit/directional*100):0)+'%</b></div>' +
      '<div><span>Average week</span><b class="'+toneCls(avg)+'">'+sgnf(avg,2)+'%</b></div>' +
    '</div></section>' +
    '<div class="note">Score buckets, per-indicator correlation and hit rates arrive in Phase 7. ' +
    'A hit rate from a sample this small is noise, not evidence.</div>';
}

function openDrawer(html){
  document.getElementById("drawer").innerHTML = html;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

function drawerFor(id){
  var M = compute();
  var r = M.rows.filter(function(x){ return x.ind.id === id; })[0];
  if(!r) return;
  var ind = r.ind, a = ago(r.val.updated);

  var extra = (ind.fields||[]).map(function(f){
    return '<div class="drow"><span>'+esc(f[0])+'</span><b>'+fmt(r.val[f[1]], f[2])+'</b></div>';
  }).join("");

  var thr = '<div class="thr">Scoring thresholds on ' + esc(ind.drvLabel.toLowerCase()) + '<table>' +
    ind.thresholds.map(function(t, i){
      var prev = i === 0 ? null : ind.thresholds[i-1].max;
      var range = prev === null ? ("below " + t.max + (ind.drvUnit||""))
        : t.max === null ? (prev + (ind.drvUnit||"") + " and above")
        : (prev + " to " + t.max + (ind.drvUnit||""));
      return '<tr class="'+(r.score === t.s && hitRow(ind, r.driver, i) ? "hit" : "")+'">' +
             '<td>'+esc(range)+'</td><td style="text-align:right">'+sgn(t.s)+'</td></tr>';
    }).join("") + '</table></div>';

  var man = STATE.manual[id] || {};
  var form = '<h3 style="font-size:14px;margin:22px 0 0">Enter values</h3>' +
    '<div class="note">Whatever you type here replaces the sample value and is marked Manual.</div>' +
    '<label class="f">'+esc(ind.drvLabel)+' (drives the score)' +
      '<input type="number" step="any" data-m="'+id+'" data-k="'+esc(ind.driver)+'" value="'+esc(man[ind.driver]===undefined?"":man[ind.driver])+'" placeholder="'+esc(MOCK.values[id] ? MOCK.values[id][ind.driver] : "")+'"></label>' +
    (ind.fields||[]).map(function(f){
      return '<label class="f">'+esc(f[0])+'<input type="text" data-m="'+id+'" data-k="'+esc(f[1])+'" value="'+esc(man[f[1]]===undefined?"":man[f[1]])+'" placeholder="'+esc(MOCK.values[id] ? MOCK.values[id][f[1]] : "")+'"></label>';
    }).join("") +
    '<label class="f">As of<input type="text" data-m="'+id+'" data-k="updated" value="'+esc(man.updated===undefined?"":man.updated)+'" placeholder="2026-09-04T17:00:00"></label>' +
    '<label class="f">Notes<textarea data-m="'+id+'" data-k="notes">'+esc(man.notes||"")+'</textarea></label>' +
    '<div class="btns"><button class="btn primary" data-act="savem" data-id="'+id+'">Save values</button>' +
    (STATE.manual[id] ? '<button class="btn danger" data-act="clearm" data-id="'+id+'">Revert to sample</button>' : '') +
    '</div>';

  openDrawer(
    '<div class="dhead"><h3>'+esc(ind.name)+(r.manual?' <span class="pill p-flat">Manual</span>':'')+'</h3>' +
      '<button class="x" data-act="close" aria-label="Close">x</button></div>' +
    '<div class="dbody">' +
      '<div class="drow"><span>'+esc(ind.drvLabel)+'</span><b>'+drv(r)+'</b></div>' +
      extra +
      '<div class="drow"><span>Score</span><b class="'+toneCls(r.score)+'">'+(r.score===null?"no data":sgn(r.score))+'</b></div>' +
      '<div class="drow"><span>Weight</span><b>'+Math.round(r.weight)+'%</b></div>' +
      '<div class="drow"><span>Contribution</span><b class="'+toneCls(r.contrib)+'">'+sgnf(r.contrib,1)+'</b></div>' +
      '<div class="drow"><span>Source</span><b>'+esc(ind.src)+'</b></div>' +
      '<div class="drow"><span>Value from</span><b>'+
        (r.src==="live"?"FRED fetch":r.src==="manual"?"your entry":"sample data")+'</b></div>' +
      (NO_FRED[ind.id] ? '<div class="note" style="margin-top:8px">'+esc(NO_FRED[ind.id])+' This one always needs entering by hand.</div>' : '') +
      '<div class="drow"><span>Updated</span><b class="'+(a.stale?"stale":"")+'">'+esc(a.txt)+'</b></div>' +
      '<div class="why">'+esc(ind.desc)+'</div>' +
      thr + form +
    '</div>'
  );
}

function hitRow(ind, driver, i){
  if(driver === null || driver === "" || isNaN(Number(driver))) return false;
  var x = Number(driver);
  for(var j=0;j<ind.thresholds.length;j++){
    var t = ind.thresholds[j];
    if(t.max === null || x < t.max) return j === i;
  }
  return false;
}

function saveSnapshot(){
  var M = compute(), P = priceInfo();
  var d = new Date(P.asOf || nowRef());
  var id = "s" + Date.now();
  var snap = {
    id:id, date:d.toISOString().slice(0,10), savedAt:new Date().toISOString(),
    priceSource:P.label, coverage:coverageState(),
    mesStart:P.price, mesEnd:null,
    score:M.total, bias:M.band.label, confidence:M.confidence, event:M.event,
    weights:JSON.parse(JSON.stringify(STATE.weights)),
    indicators:M.rows.map(function(r){
      return {id:r.ind.id, name:r.ind.name, driver:r.driver, score:r.score,
              weight:r.weight, contribution:Number(r.contrib.toFixed(2)),
              manual:r.manual, values:JSON.parse(JSON.stringify(r.val))};
    }),
    categories:M.cats.map(function(c){ return {id:c.id, name:c.name, points:c.points}; }),
    events:upcoming(7), notes:""
  };
  STATE.snaps.push(snap);
  if(save(LS.snaps, STATE.snaps)){ STATE.tab = "history"; render(); }
  else alert("Could not write to local storage. Nothing was saved.");
}

function exportJSON(){
  download("mes-regime-history.json", JSON.stringify({
    exported:new Date().toISOString(), weights:STATE.weights,
    manual:STATE.manual, snapshots:STATE.snaps
  }, null, 2), "application/json");
}

function exportCSV(){
  var head = "week,score,bias,confidence,event_risk,mes_start,mes_end,next_week_return_pct\n";
  var body = STATE.snaps.map(function(s){
    var ret = s.mesEnd ? ((Number(s.mesEnd)-Number(s.mesStart))/Number(s.mesStart)*100).toFixed(3) : "";
    return [s.date, s.score, '"'+s.bias+'"', s.confidence, s.event, s.mesStart, s.mesEnd===null?"":s.mesEnd, ret].join(",");
  }).join("\n");
  download("mes-regime-history.csv", head + body, "text/csv");
}

function download(name, text, mime){
  var b = new Blob([text], {type:mime});
  var u = URL.createObjectURL(b);
  var a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 1500);
}

function importJSON(){
  var i = document.createElement("input");
  i.type = "file"; i.accept = ".json,application/json";
  i.onchange = function(){
    var f = i.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var d = JSON.parse(rd.result);
        if(d.snapshots){ STATE.snaps = d.snapshots; save(LS.snaps, STATE.snaps); }
        if(d.weights){ STATE.weights = d.weights; save(LS.settings, STATE.weights); }
        if(d.manual){ STATE.manual = d.manual; save(LS.manual, STATE.manual); }
        render();
      }catch(e){ alert("That file could not be read as dashboard JSON."); }
    };
    rd.readAsText(f);
  };
  i.click();
}

/* =========================================================================
   LIVE FETCH
   Direct browser call to the FRED API. This only works if FRED returns CORS
   headers to this origin. If it does not, the request fails before any
   response is readable and the browser gives no detail beyond "failed" -
   so the error below reports what is knowable and points at the fallback,
   rather than guessing. Opening this file from file:// will always fail:
   the origin is null and no CORS policy can permit it.
   ========================================================================= */

function fredURL(id, n){
  var start = new Date(Date.now() - 400*864e5).toISOString().slice(0,10);
  return FRED.base + "?series_id=" + encodeURIComponent(id) +
    "&api_key=" + encodeURIComponent(STATE.key) +
    "&file_type=json&sort_order=desc&limit=" + n +
    "&observation_start=" + start;
}

function fetchLive(){
  if(STATE.fetching) return;
  if(!STATE.key){ STATE.tab = "settings"; render(); alert("Enter your FRED API key in Settings first."); return; }

  STATE.fetching = true;
  var log = [], S = {}, ids = Object.keys(FRED.series), done = 0;
  render();

  if(location.protocol === "file:"){
    STATE.fetching = false;
    STATE.live = STATE.live || {};
    STATE.live.log = [{id:"(all)", ok:false, msg:"Page opened from file://. A browser will not allow this page to call any external API from that origin. Serve the file over http first, or use the offline fetcher."}];
    render();
    return;
  }

  function finish(){
    STATE.fetching = false;
    var ok = log.filter(function(l){ return l.ok; }).length;
    if(ok === 0){
      STATE.live = STATE.live || {values:{}, index:null};
      STATE.live.log = log;
      save(LS.live, STATE.live);
      render();
      return;
    }
    var d = derive(S);
    STATE.live = {fetched:new Date().toISOString(), values:d.values, index:d.index, log:log, series:S};
    save(LS.live, STATE.live);
    render();
  }

  ids.forEach(function(id){
    fetch(fredURL(id, FRED.series[id].n))
      .then(function(r){
        if(!r.ok){
          if(r.status === 400) throw new Error("400 - FRED rejected the request. Usually an invalid API key.");
          if(r.status === 429) throw new Error("429 - rate limited. Wait a minute and retry.");
          throw new Error(r.status + " from FRED.");
        }
        return r.json();
      })
      .then(function(j){
        if(!j.observations) throw new Error("No observations in response.");
        S[id] = j.observations;
        log.push({id:id, ok:true, msg:j.observations.length + " obs"});
      })
      .catch(function(e){
        var m = String(e && e.message || e);
        if(/Failed to fetch|NetworkError|Load failed/i.test(m)){
          m = "Blocked before a response could be read. This is either no network or FRED refusing the cross-origin call.";
        }
        log.push({id:id, ok:false, msg:m});
      })
      .then(function(){ if(++done === ids.length) finish(); });
  });
}

/* Fallback path: load a JSON file produced by the offline fetcher.
   Expected shape: {fetched:"...", series:{SERIES_ID:[{date,value},...]}} */
function loadDataFile(){
  var i = document.createElement("input");
  i.type = "file"; i.accept = ".json,application/json";
  i.onchange = function(){
    var f = i.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var j = JSON.parse(rd.result);
        if(!j.series) throw new Error("no series");
        var d = derive(j.series);
        var n = Object.keys(j.series).length;
        STATE.live = {fetched:j.fetched || new Date().toISOString(), values:d.values, index:d.index,
                      series:j.series,
                      log:[{id:"file", ok:true, msg:n + " series loaded from " + f.name}]};
        save(LS.live, STATE.live);
        render();
      }catch(e){
        alert("That file is not a FRED data export. It needs a top-level \"series\" object keyed by FRED series id.");
      }
    };
    rd.readAsText(f);
  };
  i.click();
}

function clearLive(){
  STATE.live = null;
  try{ localStorage.removeItem(LS.live); }catch(e){}
  render();
}

/* =========================================================================
   EVENTS
   ========================================================================= */

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-act],[data-tab],[data-ind],[data-del]") : null;

  if(e.target.id === "themeBtn"){ toggleTheme(); return; }
  if(e.target.id === "scrim"){ closeDrawer(); return; }
  if(!t) return;

  var act = t.getAttribute("data-act");

  if(t.classList.contains("tab")){ STATE.tab = t.getAttribute("data-tab"); render(); return; }
  if(act === "tab"){ STATE.tab = t.getAttribute("data-tab"); render(); return; }
  if(act === "close"){ closeDrawer(); return; }
  if(act === "snap"){ saveSnapshot(); return; }
  if(act === "fetch"){ fetchLive(); return; }
  if(act === "loadfile"){ loadDataFile(); return; }
  if(act === "clearlive"){
    if(confirm("Discard fetched data and fall back to sample values?")) clearLive();
    return;
  }
  if(act === "savekey"){
    var el = document.getElementById("fredkey");
    STATE.key = el ? el.value.trim() : "";
    save(LS.key, STATE.key);
    render();
    return;
  }
  if(act === "exportjson"){ exportJSON(); return; }
  if(act === "exportcsv"){ exportCSV(); return; }
  if(act === "import"){ importJSON(); return; }

  if(act === "clear"){
    if(confirm("Delete all " + STATE.snaps.length + " saved weeks? This cannot be undone.")){
      STATE.snaps = []; save(LS.snaps, STATE.snaps); render();
    } return;
  }
  if(act === "clearmanual"){
    if(confirm("Remove every manual override and fall back to sample values?")){
      STATE.manual = {}; save(LS.manual, STATE.manual); render();
    } return;
  }
  if(act === "savew"){ save(LS.settings, STATE.weights); render(); return; }
  if(act === "resetw"){ STATE.weights = defaultWeights(); save(LS.settings, STATE.weights); render(); return; }
  if(act === "normalize"){
    var tot = CONFIG.indicators.reduce(function(a,i){ return a + Number(STATE.weights[i.id]||0); }, 0);
    if(tot > 0){
      CONFIG.indicators.forEach(function(i){
        STATE.weights[i.id] = Math.round(Number(STATE.weights[i.id]||0) * (100/tot) * 10)/10;
      });
      save(LS.settings, STATE.weights); render();
    } return;
  }
  if(act === "savem"){
    var id = t.getAttribute("data-id"), obj = {};
    document.querySelectorAll('[data-m="'+id+'"]').forEach(function(el){
      var v = el.value.trim();
      if(v !== "") obj[el.getAttribute("data-k")] = isNaN(Number(v)) || el.type === "text" && isNaN(Number(v)) ? v : Number(v);
    });
    if(Object.keys(obj).length) STATE.manual[id] = obj; else delete STATE.manual[id];
    save(LS.manual, STATE.manual);
    closeDrawer(); render(); return;
  }
  if(act === "clearm"){
    delete STATE.manual[t.getAttribute("data-id")];
    save(LS.manual, STATE.manual); closeDrawer(); render(); return;
  }

  var del = t.getAttribute("data-del");
  if(del){
    if(confirm("Remove this saved week?")){
      STATE.snaps = STATE.snaps.filter(function(s){ return s.id !== del; });
      save(LS.snaps, STATE.snaps); render();
    } return;
  }

  var ind = t.getAttribute("data-ind");
  if(ind){ drawerFor(ind); return; }
});

document.addEventListener("change", function(e){
  var w = e.target.getAttribute && e.target.getAttribute("data-w");
  if(w){ STATE.weights[w] = Number(e.target.value)||0; save(LS.settings, STATE.weights); render(); return; }
  var ef = e.target.getAttribute && e.target.getAttribute("data-endfor");
  if(ef){
    var v = e.target.value.trim();
    STATE.snaps.forEach(function(s){ if(s.id === ef) s.mesEnd = v === "" ? null : Number(v); });
    save(LS.snaps, STATE.snaps); render(); return;
  }
});

document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

function toggleTheme(){
  var d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
  document.getElementById("themeBtn").textContent = d ? "Dark theme" : "Light theme";
  try{ localStorage.setItem("mesrd.theme", d ? "light" : "dark"); }catch(err){}
}
(function initTheme(){
  var s = null;
  try{ s = localStorage.getItem("mesrd.theme"); }catch(err){}
  if(s === "dark"){
    document.documentElement.setAttribute("data-theme","dark");
    document.getElementById("themeBtn").textContent = "Light theme";
  } else {
    document.documentElement.setAttribute("data-theme","light");
  }
})();

render();
</script>
</body>
